<html lang="fi">

  <title>Ultra Gym · Hypertrofia</title>
  <style>
    :root{color-scheme:dark;--bg:#101b17;--surface:#192820;--surface2:#203329;--line:#34483c;--text:#f0f2e8;--muted:#a2b2a6;--accent:#c9df91;--accent2:#8eb4a0;--danger:#e9aa9d;--shadow:0 12px 30px #0003}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 85% 0,#254334 0%,transparent 36%),var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1.1px}h2{font-size:21px;letter-spacing:-.5px}h3{font-size:17px}small,.muted{color:var(--muted)}a{color:var(--accent)}
    .shell{max-width:910px;margin:0 auto;padding:0 17px 115px}.top{padding:calc(23px + env(safe-area-inset-top)) 0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;gap:12px;align-items:center}.mark{width:43px;height:43px;background:var(--accent);color:var(--bg);border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:23px;letter-spacing:-3px;padding-right:3px}.brand-title{font-size:18px;font-weight:800;letter-spacing:.3px}.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.2px}.top-pill{padding:8px 11px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--accent)}
    .hero{padding:24px;border-radius:22px;background:linear-gradient(126deg,#304638,#1b3026);border:1px solid #4b6253;box-shadow:var(--shadow);margin-bottom:17px}.hero-eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:8px}.hero h1{max-width:650px;line-height:1.1;margin-bottom:10px}.hero p{color:#c2d1c3;max-width:590px}.hero-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
    .tag{border:1px solid #527061;border-radius:99px;padding:5px 9px;font-size:12px;color:#d4e0d2}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 12px}.section-heading small{font-size:12px}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{border:1px solid var(--line);background:var(--surface);padding:14px;border-radius:16px}.kpi strong{display:block;font-size:27px;letter-spacing:-.8px;line-height:1.2;margin-top:8px}.kpi span{color:var(--muted);font-size:12px}
    .card{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:18px;margin-bottom:12px}.card-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.card-title{font-size:19px;font-weight:800}.badge{display:inline-flex;padding:5px 10px;background:var(--surface2);border-radius:99px;font-size:12px;color:var(--accent)}.card-sub{font-size:13px;color:var(--muted);margin:6px 0 13px}.button-row{display:flex;flex-wrap:wrap;gap:8px}.btn{border:1px solid #69826d;background:#263b2f;color:var(--text);border-radius:12px;padding:11px 15px;font-weight:700;transition:transform .1s,background .1s;min-height:42px}.btn:active{transform:scale(.98)}.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.btn.secondary{background:transparent;border-color:var(--line)}.btn.danger{border-color:#8a5552;color:var(--danger);background:#412821}.btn.sm{padding:7px 10px;font-size:12px;min-height:33px;border-radius:9px}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.block{width:100%}
    .ex-row{display:grid;grid-template-columns:25px 1fr auto;gap:9px;padding:12px 0;border-top:1px solid #30453a;align-items:center}.ex-row:first-of-type{border-top:0}.ex-index{width:23px;height:23px;display:grid;place-items:center;border-radius:8px;background:var(--surface2);font-size:11px;color:var(--accent)}.ex-name{font-size:14px;font-weight:700}.ex-info{font-size:12px;color:var(--muted)}.ex-reps{font-size:13px;white-space:nowrap;color:var(--accent);font-weight:750}
    .workout-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.workout-actions .card{margin-bottom:0}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#121f1bea;border-top:1px solid #345044;backdrop-filter:blur(22px);padding:9px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;justify-content:center;gap:5px}.nav-item{border:0;background:none;color:#97aa9a;padding:8px 13px;max-width:170px;flex:1;border-radius:11px;display:flex;align-items:center;flex-direction:column;gap:4px;font-size:11px;font-weight:700}.nav-item.active{background:#294334;color:var(--accent)}.nav-icon{width:21px;height:21px;display:block}.nav-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .session-sticky{position:sticky;top:0;z-index:20;background:#16271feF;border:1px solid #4a634f;border-radius:15px;backdrop-filter:blur(12px);padding:12px 14px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.session-sticky strong{color:var(--accent);font-size:18px}.timer-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;background:#283f31;border-radius:13px;margin-bottom:12px;border:1px solid #507457}.timer-digits{font-size:22px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--accent)}
    .ex-card{padding:15px;margin-bottom:12px}.ex-card h3{line-height:1.25}.ex-micro{margin:6px 0 11px;color:var(--muted);font-size:12px}.hint{padding:9px 11px;border-radius:11px;font-size:12px;background:#233c2d;color:#d2dfc7;margin-bottom:11px;border:1px solid #3c5c43}.sets-header,.set-row{display:grid;grid-template-columns:27px minmax(0,1fr) minmax(0,1fr) 57px 45px;align-items:center;gap:8px}.sets-header{font-size:11px;color:var(--muted);font-weight:700;text-align:center;padding:0 0 6px}.set-row{margin:7px 0}.set-n{text-align:center;font-size:13px;color:#c8d6c8}.number-input{min-width:0;width:100%;border-radius:9px;background:#111f18;color:var(--text);border:1px solid #45604c;min-height:45px;padding:8px 4px;text-align:center;font-size:16px}.number-input:disabled{opacity:.6}.set-row.done .number-input{border-color:#405747;background:#223628}.set-check{width:43px;height:43px;border-radius:10px;border:1px solid #4b6753;background:#293b30;color:var(--muted);font-size:20px;font-weight:900}.set-row.done .set-check{background:var(--accent);border-color:var(--accent);color:var(--bg)}.bottom-space{height:10px}
    .note-input{width:100%;min-height:84px;padding:12px;background:#102019;border:1px solid var(--line);border-radius:12px;color:var(--text);resize:vertical}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select{background:#112019;color:var(--text);border:1px solid #496050;min-height:42px;padding:9px 10px;border-radius:10px;width:100%}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field-grid .field{min-width:0}
    .history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.history-row:first-of-type{border-top:0}.history-row strong{font-size:14px}.history-row small{display:block;margin-top:2px}.history-metric{color:var(--accent);font-size:13px;white-space:nowrap}.history-row button{background:none;border:0;color:inherit;padding:6px;text-align:left}.history-detail{background:#13241c;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:7px;font-size:13px}.history-detail table{width:100%;border-collapse:collapse}.history-detail td{padding:7px 2px;border-bottom:1px solid #2b4032}.history-detail td:last-child{text-align:right;white-space:nowrap;color:#d0deb4}
    .chart-wrap{overflow:hidden;background:#102019;border:1px solid #364d3d;border-radius:13px;padding:10px 5px}.chart-wrap svg{width:100%;height:auto}.empty{padding:25px 14px;text-align:center;color:var(--muted);border:1px dashed #4b6451;border-radius:13px;font-size:13px}.progress-track{height:7px;border-radius:10px;background:#3a5040;overflow:hidden;margin:12px 0 8px}.progress-track i{display:block;height:100%;background:var(--accent);border-radius:10px;transition:width .2s}.subtle{color:var(--muted);font-size:12px}.helper{line-height:1.55;font-size:13px;color:var(--muted)}.divider{border-top:1px solid var(--line);margin:17px 0}.editor-item{border:1px solid #344b3c;border-radius:12px;padding:12px;margin-top:9px;background:#14251c}.editor-item summary{font-size:13px;font-weight:700;cursor:pointer}.editor-item .editor-fields{margin-top:12px}.toast{position:fixed;bottom:calc(87px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:70;background:var(--accent);color:#12221a;font-weight:750;font-size:13px;padding:10px 16px;border-radius:99px;box-shadow:var(--shadow);max-width:min(92vw,430px);text-align:center}.hidden{display:none!important}.spaced{margin-top:12px}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.date{font-variant-numeric:tabular-nums}.tiny{font-size:11px}.flex-between{display:flex;justify-content:space-between;align-items:center;gap:8px}.color-green{color:var(--accent)}
    @media(max-width:520px){.shell{padding:0 13px 105px}.hero{padding:21px}.hero h1{font-size:28px}.cards{gap:7px}.kpi{padding:11px}.kpi strong{font-size:23px}.kpi span{font-size:11px}.card{padding:15px}.workout-actions{grid-template-columns:1fr}.sets-header,.set-row{grid-template-columns:25px minmax(0,1fr) minmax(0,1fr) 51px 43px;gap:5px}.number-input{padding:7px 2px;font-size:15px}.set-check{width:41px}.field-grid.three{grid-template-columns:1fr 1fr}.top-pill{font-size:11px;padding:7px}.ex-reps{font-size:12px}.nav-item{padding:7px 7px}}
    @media(min-width:700px){.hero{padding:30px}.shell{padding-left:24px;padding-right:24px}.ex-card{padding:19px}.two-cols.desktop{grid-template-columns:1.15fr 1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (()=>{'use strict';
    const KEY='ultragym-data-v1';
    const PROGRAM={
      upper:[
        {id:'u-bench',name:'Penkkipunnerrus',sets:3,min:6,max:10,rest:150,group:'Rinta',increment:2.5,note:'Lapaluut tukevasti penkkiin. Hallittu lasku ja täysi liikerata.'},
        {id:'u-row',name:'Rintatuettu soutu',sets:3,min:8,max:12,rest:120,group:'Selkä',increment:2.5,note:'Vedä kyynärpäät taakse ja pidä rintakehä tuessa.'},
        {id:'u-incline',name:'Vinopenkki käsipainoilla',sets:2,min:8,max:12,rest:120,group:'Rinta',increment:2,note:'Maltillinen 15–30° kulma. Merkitse käsipainon paino per käsi.'},
        {id:'u-pull',name:'Ylätalja',sets:3,min:8,max:12,rest:120,group:'Selkä',increment:2.5,note:'Vie kyynärpäät kohti kylkiä ilman vartalon heilumista.'},
        {id:'u-lateral',name:'Vipunostot sivulle',sets:3,min:12,max:20,rest:75,group:'Olkapäät',increment:1,note:'Hallittu liike, älä keinuta vartaloa.'},
        {id:'u-rear',name:'Takaolkapäät taljassa',sets:2,min:12,max:20,rest:75,group:'Olkapäät',increment:1,note:'Pidä olkapäät alhaalla ja hae venytys takaolkapäälle.'},
        {id:'u-curl',name:'Hauiskääntö taljassa',sets:2,min:10,max:15,rest:75,group:'Hauis',increment:1.25,note:'Kyynärpäät paikoillaan, hallittu lasku.'},
        {id:'u-tricep',name:'Ojentajapunnerrus taljassa',sets:2,min:10,max:15,rest:75,group:'Ojentaja',increment:1.25,note:'Olkavarret lähellä vartaloa, täysi ojennus.'},
      ],
      lower:[
        {id:'l-squat',name:'Hack-kyykky / takakyykky',sets:3,min:6,max:10,rest:180,group:'Etureidet',increment:5,note:'Valitse yksi versio ja käytä samaa säännöllisesti. Hallittu syvyys.'},
        {id:'l-rdl',name:'Romanialainen maastaveto',sets:3,min:6,max:10,rest:150,group:'Takareidet',increment:2.5,note:'Työnnä lantiota taakse, säilytä selän asento. Liikerata liikkuvuuden mukaan.'},
        {id:'l-press',name:'Jalkaprässi',sets:3,min:10,max:15,rest:120,group:'Etureidet',increment:5,note:'Hallitse ala-asento, vältä lantion pyöristymistä.'},
        {id:'l-curl',name:'Takareisikoukistus',sets:3,min:10,max:15,rest:90,group:'Takareidet',increment:2.5,note:'Pidä lantio paikoillaan ja laske paino hallitusti.'},
        {id:'l-calves',name:'Pohjenousut',sets:3,min:10,max:20,rest:75,group:'Pohkeet',increment:2.5,note:'Pysähdy ylhäällä ja anna pohkeen venyä alhaalla.'},
        {id:'l-abs',name:'Vatsarutistus taljassa',sets:3,min:10,max:15,rest:75,group:'Keskivartalo',increment:2.5,note:'Liike rintakehästä kohti lantiota, ei pelkkä käsiveto.'}
      ]
    };
    const DEFAULT=()=>({version:1,program:structuredCopy(PROGRAM),history:[],active:null,settings:{weekly:3,goalWeight:80,bodyweights:[]}});
    function structuredCopy(o){return JSON.parse(JSON.stringify(o))}
    function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.program&&Array.isArray(v.history)&&v.settings&&v.program.upper&&v.program.lower){v.version=1;v.settings.weekly=Number(v.settings.weekly)||3;v.settings.bodyweights=Array.isArray(v.settings.bodyweights)?v.settings.bodyweights:[];return v}}catch(e){}return DEFAULT()}
    let data=load(),tab='today',detailsOpened=null,statExercise='u-bench',toastTimer=null;
    const $=sel=>document.querySelector(sel);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmtDate=d=>new Date(d).toLocaleDateString('fi-FI',{day:'numeric',month:'short',year:'numeric'});
    const fmtTime=d=>new Date(d).toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'});
    const isoLocalDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const n=v=>Number.isFinite(Number(v))?Number(v):0;
    const dur=s=>Math.round((Date.now()-new Date(s).getTime())/60000);
    const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Tallennustila on täynnä tai estetty. Vie varmuuskopio asetuksista.')}};
    const label=k=>k==='upper'?'Ylävartalo':'Alavartalo';
    const shortlabel=k=>k==='upper'?'A · UPPER':'B · LOWER';
    const totalSets=k=>data.program[k].reduce((a,e)=>a+e.sets,0);
    const recent=()=>[...data.history].sort((a,b)=>new Date(b.date)-new Date(a.date));
    const next=()=>{const r=recent();return r.length?(r[0].kind==='upper'?'lower':'upper'):'upper'};
    const compSets=entries=>Object.values(entries||{}).reduce((a,arr)=>a+arr.filter(x=>x.done).length,0);
    const exLast=id=>recent().map(h=>h.sets.filter(s=>s.exerciseId===id)).find(a=>a.length)||[];
    function recommend(ex){const arr=exLast(ex.id);if(!arr.length)return {weight:'',tip:'Ensimmäinen kerta – valitse paino, jolla jää 2 toistoa varastoon.'};const lastWeight=Math.max(...arr.map(s=>n(s.weight)));const atWeight=arr.filter(s=>n(s.weight)===lastWeight);const hit=atWeight.length>=ex.sets&&atWeight.every(s=>n(s.reps)>=ex.max&&n(s.rir)>=1);const weight=+(lastWeight+(hit?n(ex.increment):0)).toFixed(2);return {weight:String(weight),tip:hit?`Edellisellä kerralla toistoalue täyttyi: kokeile ${weight} kg (+${ex.increment} kg).`:`Viimeksi ${lastWeight} kg. Kasvata ensin toistoja kohti ${ex.max}:ttä.`}}
    function icon(name){const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',book:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/>',chart:'<path d="M4 20V4M4 20h17M8 16l4-5 4 2 4-8"/>',settings:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#121f1b"/><circle cx="16" cy="12" r="2" fill="#121f1b"/><circle cx="11" cy="17" r="2" fill="#121f1b"/>'};return `<span class="nav-icon"><svg viewBox="0 0 24 24">${icons[name]}</svg></span>`}
    function nav(){const items=[['today','Treeni','home'],['history','Historia','book'],['stats','Kehitys','chart'],['settings','Asetukset','settings']];return `<nav class="bottom-nav" aria-label="Päänavigaatio">${items.map(([id,title,ic])=>`<button type="button" class="nav-item ${tab===id?'active':''}" data-action="tab" data-tab="${id}">${icon(ic)}${title}</button>`).join('')}</nav>`}
    function top(){return `<header class="top"><div class="brand"><div class="mark">UG</div><div><div class="brand-title">ULTRA GYM</div><div class="brand-sub">HYPERTROPHY TRACKER</div></div></div><span class="top-pill">2-JAKOINEN · ${data.settings.weekly}× / VKO</span></header>`}
    const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
    function kpis(){const t=Date.now(),w=7*864e5,m=30*864e5;const last7=data.history.filter(h=>t-new Date(h.date).getTime()<w);const last30=data.history.filter(h=>t-new Date(h.date).getTime()<m);let sets=last7.reduce((s,h)=>s+h.sets.length,0);return `<div class="cards"><div class="kpi"><span>Viimeiset 30 pv</span><strong>${last30.length}</strong><span>treeniä</span></div><div class="kpi"><span>Viimeiset 7 pv</span><strong>${sets}</strong><span>työsarjaa</span></div><div class="kpi"><span>Kaikki treenit</span><strong>${data.history.length}</strong><span>tallennettu</span></div></div>`}
    function overview(k){return `<section class="card"><div class="card-head"><div><div class="card-title">${k==='upper'?'A · Ylävartalo':'B · Alavartalo'}</div><div class="card-sub">${data.program[k].length} liikettä · ${totalSets(k)} työsarjaa</div></div><span class="badge">${k==='upper'?'UPPER':'LOWER'}</span></div>${data.program[k].map((e,i)=>`<div class="ex-row"><div class="ex-index">${i+1}</div><div><div class="ex-name">${esc(e.name)}</div><div class="ex-info">${esc(e.group)} · ${e.rest}s palautus</div></div><div class="ex-reps">${e.sets} × ${e.min}–${e.max}</div></div>`).join('')}<button type="button" class="btn ${next()===k?'primary':'secondary'} block spaced" data-action="start" data-kind="${k}">Aloita ${label(k).toLowerCase()}</button></section>`}
    function dashboard(){return `<section class="hero"><div class="hero-eyebrow">VAHVEMPI JOKA VIIKKO</div><h1>Treenaa. Kirjaa. Kehity.</h1><p>Kaksijakoinen lihaskasvuohjelma, jossa jokainen työsarja vie eteenpäin. Ei supersettejä.</p><div class="hero-row"><span class="tag">Progressiivinen ylikuormitus</span><span class="tag">1–3 RIR</span><span class="tag">55–75 min</span></div></section>${kpis()}<div class="section-heading"><h2>Seuraava treeni</h2><small>${data.settings.weekly} treeniä / viikko</small></div><div class="card"><div class="card-head"><div><div class="badge">${shortlabel(next())}</div><h2 class="spaced">${label(next())}</h2><p class="card-sub">${totalSets(next())} sarjaa · tavoitteena 1–3 toistoa varastoon</p></div></div><button type="button" class="btn primary block" data-action="start" data-kind="${next()}">Aloita treeni</button></div><div class="section-heading"><h2>Ohjelmasi</h2><small>A / B -vuorottelu</small></div><div class="two-cols">${overview('upper')}${overview('lower')}</div><p class="helper spaced">${data.settings.weekly===3?'3× viikossa: A–B–A, seuraavalla viikolla B–A–B.':'4× viikossa: A–B–A–B. Väliin vähintään yksi kevyempi / vapaa päivä kun mahdollista.'} Jätä raskas jalkatreeni kauemmas pitkästä juoksusta.</p>`}
    function start(kind){if(data.active){tab='today';render();return}const entries={};for(const ex of data.program[kind]){const rec=recommend(ex);entries[ex.id]=Array.from({length:ex.sets},()=>({weight:rec.weight,reps:'',rir:'2',done:false}))}data.active={id:String(Date.now()),kind,startedAt:new Date().toISOString(),entries,notes:''};save();tab='today';render();scrollTo(0,0)}
    function working(){const a=data.active;const count=compSets(a.entries);const total=totalSets(a.kind);return `<div class="session-sticky"><div><div class="tiny muted">KÄYNNISSÄ · ${shortlabel(a.kind)}</div><strong>${count} / ${total} sarjaa</strong></div><div><small id="elapsed">${Math.max(0,dur(a.startedAt))} min</small><div class="progress-track" style="width:118px"><i style="width:${Math.round(count/Math.max(total,1)*100)}%"></i></div></div></div><div id="rest-container"></div>${data.program[a.kind].map((ex,i)=>workingEx(ex,i)).join('')}<section class="card"><h3>Treenin muistiinpanot</h3><p class="card-sub">Fiilis, tekniikka, olosuhteet tai juoksukuormitus.</p><textarea class="note-input" data-action="notes" placeholder="Miltä treeni tuntui?">${esc(a.notes)}</textarea><div class="button-row spaced"><button class="btn primary" data-action="finish">Tallenna treeni (${count} sarjaa)</button><button class="btn danger" data-action="discard">Hylkää treeni</button></div><p class="helper spaced">Sarjan vihreä ✓ tallentaa tehdyn sarjan. Keskeneräinen treeni säilyy selaimessa.</p></section>`}
    function workingEx(ex,index){const a=data.active,sets=a.entries[ex.id]||[],rec=recommend(ex),done=sets.filter(s=>s.done).length;return `<section class="card ex-card"><div class="card-head"><div><h3>${index+1}. ${esc(ex.name)}</h3><p class="ex-micro">${ex.sets} × ${ex.min}–${ex.max} · ${ex.rest>=120?Math.round(ex.rest/60*10)/10+' min':ex.rest+' s'} lepo · ${esc(ex.group)}</p></div><span class="badge">${done}/${sets.length}</span></div><div class="hint">${esc(rec.tip)}</div><div class="sets-header"><span>#</span><span>KG</span><span>TOISTOT</span><span>RIR</span><span>OK</span></div>${sets.map((s,j)=>`<div class="set-row ${s.done?'done':''}"><span class="set-n">${j+1}</span><input class="number-input" aria-label="${esc(ex.name)} sarja ${j+1} paino kilogrammoina" inputmode="decimal" type="number" min="0" step="0.5" data-action="set-input" data-id="${esc(ex.id)}" data-index="${j}" data-field="weight" value="${esc(s.weight)}" placeholder="kg" ${s.done?'disabled':''}><input class="number-input" aria-label="${esc(ex.name)} sarja ${j+1} toistot" inputmode="numeric" type="number" min="0" max="100" step="1" data-action="set-input" data-id="${esc(ex.id)}" data-index="${j}" data-field="reps" value="${esc(s.reps)}" placeholder="kpl" ${s.done?'disabled':''}><input class="number-input" aria-label="${esc(ex.name)} sarja ${j+1} RIR" inputmode="numeric" type="number" min="0" max="10" step="1" data-action="set-input" data-id="${esc(ex.id)}" data-index="${j}" data-field="rir" value="${esc(s.rir)}" ${s.done?'disabled':''}><button type="button" class="set-check" aria-label="${s.done?'Poista sarjan merkintä':'Merkitse sarja tehdyksi'}" data-action="toggle-set" data-id="${esc(ex.id)}" data-index="${j}">${s.done?'✓':'○'}</button></div>`).join('')}<p class="helper spaced">${esc(ex.note)}</p></section>`}
    let restEnd=0,restSeconds=0;
    function restHtml(){if(!restEnd)return '';const diff=Math.max(0,Math.ceil((restEnd-Date.now())/1000));if(diff===0){restEnd=0;return ''}return `<div class="timer-box"><div><div class="tiny muted">PALAUTUSTAUKO</div><div class="timer-digits" id="rest-time">${timerfmt(diff)}</div></div><div class="button-row"><button class="btn sm" data-action="rest-plus">+30 s</button><button class="btn sm secondary" data-action="rest-skip">Ohita</button></div></div>`}
    const timerfmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    function updateClocks(){if(data.active){const el=$('#elapsed');if(el)el.textContent=Math.max(0,dur(data.active.startedAt))+' min'}const cont=$('#rest-container');if(cont){if(restEnd && Date.now()>=restEnd){restEnd=0;cont.innerHTML='';notify('Palautustauko ohi – seuraava sarja');if(navigator.vibrate)navigator.vibrate([100,80,100])}else if(restEnd){if(!$('#rest-time'))cont.innerHTML=restHtml();else $('#rest-time').textContent=timerfmt(Math.max(0,Math.ceil((restEnd-Date.now())/1000)))}else if(cont.firstChild){cont.innerHTML=''}}}
    function toggleSet(id,index){const a=data.active;if(!a||!a.entries[id]||!a.entries[id][index])return;const s=a.entries[id][index];if(!s.done){if(s.weight===''||s.reps===''||n(s.reps)<=0||n(s.weight)<0||n(s.rir)<0){notify('Täytä paino, toistot ja RIR ennen kuittausta');return}if(n(s.reps)>100||n(s.weight)>2000||n(s.rir)>10){notify('Tarkista sarjan arvot');return}s.done=true;const ex=data.program[a.kind].find(e=>e.id===id);if(ex){restSeconds=ex.rest;restEnd=Date.now()+ex.rest*1000}}else{s.done=false}save();const y=scrollY;render();scrollTo(0,y)}
    function finish(){const a=data.active;if(!a)return;const ss=[];for(const ex of data.program[a.kind])for(const s of (a.entries[ex.id]||[]))if(s.done)ss.push({exerciseId:ex.id,name:ex.name,weight:n(s.weight),reps:n(s.reps),rir:n(s.rir),group:ex.group});if(!ss.length){notify('Kuittaa vähintään yksi sarja ennen tallennusta');return}if(ss.length<totalSets(a.kind)&&!confirm(`Vain ${ss.length}/${totalSets(a.kind)} sarjaa kuitattu. Tallennetaanko silti?`))return;data.history.push({id:a.id,date:new Date().toISOString(),kind:a.kind,duration:Math.max(1,dur(a.startedAt)),notes:a.notes,sets:ss});data.active=null;restEnd=0;save();tab='history';render();scrollTo(0,0);notify('Treeni tallennettu!')}
    function historyView(){const rr=recent();return `<div class="section-heading"><h1>Treenihistoria</h1><small>${rr.length} tallennusta</small></div>${rr.length?rr.map(h=>{const volume=h.sets.reduce((a,s)=>a+n(s.weight)*n(s.reps),0);return `<section class="card"><div class="flex-between"><div><span class="badge">${shortlabel(h.kind)}</span><h3 class="spaced">${fmtDate(h.date)}</h3><p class="card-sub">${fmtTime(h.date)} · ${h.duration} min · ${h.sets.length} sarjaa</p></div><div style="text-align:right"><div class="color-green" style="font-weight:800">${Math.round(volume).toLocaleString('fi-FI')} kg</div><small>volyymi-indeksi*</small></div></div><div class="button-row"><button class="btn sm secondary" data-action="details" data-id="${h.id}">${detailsOpened===h.id?'Sulje':'Näytä sarjat'}</button><button class="btn sm danger" data-action="delete-history" data-id="${h.id}">Poista</button></div>${detailsOpened===h.id?`<div class="history-detail"><table><tbody>${h.sets.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.weight)} kg × ${esc(s.reps)} <span class="muted">(${esc(s.rir)} RIR)</span></td></tr>`).join('')}</tbody></table>${h.notes?`<p class="helper spaced">${esc(h.notes)}</p>`:''}</div>`:''}</section>`}).join(''):'<div class="empty">Ei vielä tallennettuja treenejä. Aloita A tai B Treeni-välilehdeltä.</div>'}`}
    function plot(points){if(!points.length)return '<div class="empty">Valitusta liikkeestä ei ole vielä harjoitusdataa.</div>';const vals=points.map(p=>p.y),min=Math.min(...vals),max=Math.max(...vals),lo=Math.max(0,Math.floor((min-(max-min)*.2-2)/5)*5),hi=Math.ceil((max+(max-min)*.2+2)/5)*5||5;const W=650,H=235,left=45,top=18,bottom=40,right=18,areaW=W-left-right,areaH=H-top-bottom;const x=i=>left+(points.length===1?areaW/2:i/(points.length-1)*areaW),y=v=>top+areaH-(v-lo)/Math.max(hi-lo,1)*areaH;let html='<svg viewBox="0 0 650 235" role="img" aria-label="Harjoituspainojen kehitysdiagrammi">';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;html+=`<line x1="${left}" y1="${y(v)}" x2="${W-right}" y2="${y(v)}" stroke="#3b5947" stroke-dasharray="3 5"/><text x="${left-7}" y="${y(v)+4}" text-anchor="end" fill="#a5b8a8" font-size="11">${Math.round(v)}</text>`}html+=`<polyline points="${points.map((p,i)=>`${x(i)},${y(p.y)}`).join(' ')}" fill="none" stroke="#c9df91" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;points.forEach((p,i)=>{html+=`<circle cx="${x(i)}" cy="${y(p.y)}" r="5" fill="#c9df91" stroke="#1c2e23" stroke-width="2"><title>${esc(fmtDate(p.date))}: ${p.y.toFixed(1)} kg</title></circle>`});const ids=[0,Math.floor((points.length-1)/2),points.length-1].filter((x,i,arr)=>arr.indexOf(x)===i);ids.forEach(i=>{html+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" fill="#a5b8a8" font-size="11">${esc(new Date(points[i].date).toLocaleDateString('fi-FI',{day:'numeric',month:'numeric'}))}</text>`});return `<div class="chart-wrap">${html}</svg></div>`}
    function statsView(){const all=[...data.program.upper,...data.program.lower];if(!all.find(e=>e.id===statExercise))statExercise=all[0]?.id||'';const rr=[...data.history].sort((a,b)=>new Date(a.date)-new Date(b.date));const points=rr.map(h=>{const sets=h.sets.filter(s=>s.exerciseId===statExercise&&n(s.weight)>0&&n(s.reps)>0);return sets.length?{date:h.date,y:Math.max(...sets.map(s=>n(s.weight)*(1+n(s.reps)/30)))}:null}).filter(Boolean).slice(-12);const body=data.settings.bodyweights||[];const bwpts=[...body].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12).map(p=>({date:p.date,y:n(p.kg)}));return `<div class="section-heading"><h1>Kehitys</h1><small>Tavoitteet & trendit</small></div>${kpis()}<section class="card spaced"><h2>Voimatasojen kehitys</h2><p class="card-sub">Arvioitu 1RM – vain suuntaa antava, ei maksimiykköstesti.</p><div class="field"><label for="stat-ex">Valitse liike</label><select id="stat-ex" data-action="stat-ex">${all.map(ex=>`<option value="${esc(ex.id)}" ${ex.id===statExercise?'selected':''}>${esc(ex.name)}</option>`).join('')}</select></div>${plot(points)}${points.length?`<div class="cards spaced"><div class="kpi"><span>Ensimmäinen arvio</span><strong>${points[0].y.toFixed(1)}</strong><span>kg</span></div><div class="kpi"><span>Viimeisin arvio</span><strong>${points[points.length-1].y.toFixed(1)}</strong><span>kg</span></div><div class="kpi"><span>Muutos</span><strong>${points[points.length-1].y-points[0].y>=0?'+':''}${(points[points.length-1].y-points[0].y).toFixed(1)}</strong><span>kg</span></div></div>`:''}</section><section class="card"><h2>Painon kehitys</h2><p class="card-sub">Kehonpainotavoite ${n(data.settings.goalWeight)||80} kg</p>${plot(bwpts)}<div class="field-grid spaced"><div class="field"><label for="body-kg">Tämänhetkinen paino, kg</label><input id="body-kg" type="number" step="0.1" inputmode="decimal" min="20" max="400" placeholder="76.0"></div><div class="field"><label for="body-date">Päivämäärä</label><input id="body-date" type="date" value="${isoLocalDate()}"></div></div><button class="btn primary" data-action="save-weight">Tallenna paino</button></section><p class="helper">Arvioitu 1RM = paino × (1 + toistot / 30). Sarjapaino ja toistot täytyy suhteuttaa toisiinsa, eikä arvio korvaa todellista voimatestiä. *Volyymi-indeksi laskee kirjattu kg × toistot, eikä esimerkiksi kahden käsipainon yhteispainoa tai todellista lihaskasvua.</p>`}
    function editor(k){return `<section class="card"><div class="card-head"><div><h3>${label(k)}</h3><p class="card-sub">Muokkaa liikkeitä ja sarjoja. Muutokset koskevat uusia treenejä.</p></div><span class="badge">${data.program[k].length} liikettä</span></div>${data.program[k].map((ex,i)=>`<details class="editor-item"><summary>${i+1}. ${esc(ex.name)} · ${ex.sets} × ${ex.min}–${ex.max}</summary><div class="editor-fields"><div class="field"><label>Liikkeen nimi</label><input type="text" maxlength="90" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="name" value="${esc(ex.name)}"></div><div class="field-grid three"><div class="field"><label>Sarjat</label><input type="number" min="1" max="8" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="sets" value="${ex.sets}"></div><div class="field"><label>Toistot min</label><input type="number" min="1" max="40" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="min" value="${ex.min}"></div><div class="field"><label>Toistot max</label><input type="number" min="1" max="40" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="max" value="${ex.max}"></div><div class="field"><label>Lepo (sek)</label><input type="number" min="30" max="600" step="15" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="rest" value="${ex.rest}"></div><div class="field"><label>Lisäys (kg)</label><input type="number" min="0.25" max="20" step="0.25" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="increment" value="${ex.increment}"></div><div class="field"><label>Lihasryhmä</label><input type="text" maxlength="40" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="group" value="${esc(ex.group)}"></div></div><div class="field"><label>Tekniikkavinkki</label><input type="text" maxlength="220" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="note" value="${esc(ex.note)}"></div><div class="button-row"><button class="btn sm secondary" data-action="move" data-kind="${k}" data-id="${esc(ex.id)}" data-dir="-1" ${i===0?'disabled':''}>↑ Ylös</button><button class="btn sm secondary" data-action="move" data-kind="${k}" data-id="${esc(ex.id)}" data-dir="1" ${i===data.program[k].length-1?'disabled':''}>↓ Alas</button><button class="btn sm danger" data-action="delete-ex" data-kind="${k}" data-id="${esc(ex.id)}">Poista</button></div></div></details>`).join('')}<button class="btn secondary block spaced" data-action="add-ex" data-kind="${k}">+ Lisää liike</button></section>`}
    function settingsView(){return `<div class="section-heading"><h1>Asetukset</h1><small>Oma ohjelmasi</small></div><section class="card"><h2>Harjoittelun rytmi</h2><p class="card-sub">Pidä ohjelma yksinkertaisena: A ja B vuorottelevat.</p><div class="field"><label for="frequency">Treenejä viikossa</label><select id="frequency" data-action="frequency"><option value="3" ${data.settings.weekly===3?'selected':''}>3 – yhdistä juoksuun (A–B–A / B–A–B)</option><option value="4" ${data.settings.weekly===4?'selected':''}>4 – lihaskasvun painotus (A–B–A–B)</option></select></div><div class="field"><label for="goal">Kehonpainotavoite (kg)</label><input id="goal" type="number" min="20" max="400" step="0.5" data-action="goal" value="${esc(data.settings.goalWeight)}"></div><p class="helper">Työsarjat tyypillisesti 1–3 RIR. Kunkin liikkeen toistoalueen täyttyessä nosta työpainoa seuraavalla harjoituskerralla.</p></section><div class="section-heading"><h2>Muokkaa treenijakoa</h2><small>Yksilöllinen ohjelma</small></div>${editor('upper')}${editor('lower')}<section class="card"><h2>Varmuuskopiointi</h2><p class="card-sub">Tiedot tallentuvat vain tämän selaimen / asennetun sovelluksen paikalliseen tallennustilaan. Eivät synkronoidu laitteiden välillä.</p><div class="button-row"><button class="btn primary" data-action="export">Vie kaikki (JSON)</button><button class="btn secondary" data-action="csv">Vie sarjat (CSV)</button><button class="btn secondary" data-action="import">Tuo varmuuskopio</button><input id="import-file" class="hidden" type="file" accept=".json,application/json"></div><div class="divider"></div><div class="button-row"><button class="btn secondary" data-action="reset-program">Palauta oletusliikkeet</button><button class="btn danger" data-action="wipe">Poista kaikki tiedot</button></div></section><p class="helper">Yksityisyys: sovellus ei lähetä treenitietoja palvelimelle. Varmuuskopiointi kannattaa tehdä säännöllisesti, sillä selaimen tietojen poistaminen voi hävittää historian.</p>`}
    function notify(msg){document.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.textContent=msg;document.body.appendChild(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3000)}
    function render(){let content=tab==='today'?(data.active?working():dashboard()):tab==='history'?historyView():tab==='stats'?statsView():settingsView();$('#app').innerHTML=`<main class="shell">${top()}${content}</main>${nav()}`;updateClocks()}
    document.addEventListener('input',e=>{const el=e.target,act=el.dataset.action;if(act==='set-input'&&data.active){const s=data.active.entries[el.dataset.id]?.[Number(el.dataset.index)];if(s){s[el.dataset.field]=el.value;save()}}if(act==='notes'&&data.active){data.active.notes=el.value;save()}});
    document.addEventListener('change',e=>{const el=e.target,act=el.dataset.action;if(act==='frequency'){data.settings.weekly=Number(el.value);save();render()}else if(act==='goal'){data.settings.goalWeight=n(el.value);save();notify('Tavoite päivitetty')}else if(act==='stat-ex'){statExercise=el.value;render()}else if(act==='edit'){const ex=data.program[el.dataset.kind]?.find(x=>x.id===el.dataset.id);if(!ex)return;let v=el.value;const field=el.dataset.field;if(['sets','min','max','rest','increment'].includes(field)){v=n(v);const ranges={sets:[1,8],min:[1,40],max:[1,40],rest:[30,600],increment:[.25,20]},[lo,hi]=ranges[field];v=Math.max(lo,Math.min(hi,v))}else v=v.trim();if(!v&&typeof v==='string'){notify('Kenttä ei voi olla tyhjä');render();return}ex[field]=v;if(ex.min>ex.max)ex.max=ex.min;save();notify('Muutos tallennettu');/* Don't rerender: preserve open editor */}else if(el.id==='import-file'){const file=el.files?.[0];if(file)importFile(file)}});
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||!el.matches('button'))return;const action=el.dataset.action;if(action==='tab'){tab=el.dataset.tab;render();scrollTo(0,0)}else if(action==='start')start(el.dataset.kind);else if(action==='toggle-set')toggleSet(el.dataset.id,Number(el.dataset.index));else if(action==='finish')finish();else if(action==='discard'){if(confirm('Hylätäänkö keskeneräinen treeni?')){data.active=null;restEnd=0;save();render()}}else if(action==='rest-plus'){restEnd=restEnd?restEnd+30000:Date.now()+30000;updateClocks()}else if(action==='rest-skip'){restEnd=0;updateClocks()}else if(action==='details'){detailsOpened=detailsOpened===el.dataset.id?null:el.dataset.id;render()}else if(action==='delete-history'){if(confirm('Poistetaanko tämä harjoitus historiasta?')){data.history=data.history.filter(h=>h.id!==el.dataset.id);save();render()}}else if(action==='save-weight'){const kg=n($('#body-kg')?.value),date=$('#body-date')?.value;if(kg<20||kg>400||!date){notify('Tarkista paino ja päivämäärä');return}data.settings.bodyweights.push({date:new Date(`${date}T12:00:00`).toISOString(),kg});save();render();notify('Paino tallennettu')}else if(action==='export')download('ultra-gym-varmuuskopio.json','application/json',JSON.stringify(data,null,2));else if(action==='csv')exportCSV();else if(action==='import')$('#import-file').click();else if(action==='reset-program'){if(confirm('Palautetaanko alkuperäiset A- ja B-liikkeet? Historia säilyy.')){data.program=structuredCopy(PROGRAM);data.active=null;save();render()}}else if(action==='wipe'){if(confirm('Poistetaanko KAIKKI harjoitustiedot, painot ja asetukset pysyvästi? Vie varmuuskopio ensin.')){data=DEFAULT();save();render()}}else if(action==='add-ex'){const kind=el.dataset.kind;const name=prompt('Uuden liikkeen nimi');if(!name?.trim())return;data.program[kind].push({id:`custom-${Date.now()}-${Math.floor(Math.random()*1e4)}`,name:name.trim().slice(0,90),sets:3,min:8,max:12,rest:90,group:'Muu',increment:2.5,note:'Hallittu liikerata.'});save();render()}else if(action==='delete-ex'){const kind=el.dataset.kind;if(data.program[kind].length<=1){notify('Treenissä pitää olla vähintään yksi liike');return}if(confirm('Poistetaanko tämä liike ohjelmasta? Aiemmat treenitulokset säilyvät.')){data.program[kind]=data.program[kind].filter(ex=>ex.id!==el.dataset.id);save();render()}}else if(action==='move'){const arr=data.program[el.dataset.kind];const ix=arr.findIndex(x=>x.id===el.dataset.id),to=ix+Number(el.dataset.dir);if(ix<0||to<0||to>=arr.length)return;[arr[ix],arr[to]]=[arr[to],arr[ix]];save();render()}});
    function download(filename,type,content){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Tiedosto valmis')}
    function exportCSV(){const rows=[['päivä','jako','liike','lihasryhmä','paino_kg','toistot','RIR','kesto_min']];for(const h of recent())for(const s of h.sets)rows.push([h.date,h.kind,s.name,s.group||'',s.weight,s.reps,s.rir,h.duration]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');download('ultra-gym-sarjat.csv','text/csv;charset=utf-8',csv)}
    async function importFile(file){try{const raw=JSON.parse(await file.text());if(!raw||!raw.program||!Array.isArray(raw.program.upper)||!Array.isArray(raw.program.lower)||!Array.isArray(raw.history)||!raw.settings||!Array.isArray(raw.settings.bodyweights))throw Error('Virheellinen tiedosto');if(raw.history.length>50000||raw.program.upper.length>100||raw.program.lower.length>100)throw Error('Tiedostossa liikaa tietoja');if(!confirm('Korvataanko nykyiset tiedot varmuuskopion sisällöllä?'))return;data=raw;data.active=null;save();tab='today';render();notify('Varmuuskopio tuotu')}catch(e){alert('Varmuuskopion tuonti epäonnistui: '+e.message)}}
    setInterval(updateClocks,1000);
    if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
    render();
  })();
  </script>
