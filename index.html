/* 6.2 — compact mobile-friendly trends */
.metrics-five{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.metrics-five .kpi{min-height:108px;padding:12px}
.metrics-five .kpi .value{font-size:24px}
.trend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.trend-card{border:1px solid var(--line);background:#161c20;border-radius:10px;padding:14px;min-width:0}
.trend-card svg{width:100%;height:100px;display:block}
.trend-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.trend-meta{color:var(--muted);font-size:11px;line-height:1.5}
.source-chip{font-size:10px;border:1px solid #41505a;background:#243037;border-radius:5px;color:#b5c7d0;padding:2px 5px}

/* 6.2.1 — iPhone-first quick start and single-exercise logging */
.train-quick{border-color:#3b6450;background:linear-gradient(145deg,#1b2a24,#141a1b)}
.quick-title{font-size:25px;line-height:1.18;margin:12px 0 7px}
.quick-start{margin-top:18px;min-height:54px;font-size:15px}
.library-toggle{min-height:48px;border-color:#3f5551}
.train-details summary{cursor:pointer;font-weight:750;color:#d9e7e1;min-height:28px}
.active-head{margin:10px 0 16px;font-size:28px}
.exercise-switch{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:8px;margin:13px 0}
.exercise-switch .btn{padding:9px 7px;font-size:12px;min-height:43px}
.exercise-count{text-align:center;font-size:10px;color:#8dad9d;font-weight:800;letter-spacing:.7px}
.exercise-count b{display:block;color:#e4eee9;font-size:13px;letter-spacing:0;line-height:1.25;margin-top:3px}
.exercise-dots{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:3px 2px 12px}
.exercise-dots::-webkit-scrollbar{display:none}
.exercise-dot{flex:0 0 41px;height:41px;background:#1b2425;color:#bccac5;border:1px solid #3a4b49;border-radius:10px;font-weight:800}
.exercise-dot.focused{background:#234534;border-color:#66b38b;color:#e5ffec;box-shadow:0 0 0 1px #66b38b}
.exercise-dot.complete{background:#266748;border-color:#38916b;color:#f0fff4}
.session-focus{margin-top:0;padding:14px 11px}
.session-focus .set{grid-template-columns:19px repeat(3,minmax(0,1fr)) 46px;gap:6px;align-items:center}
.session-focus .set input{min-height:46px;font-size:16px;padding:7px 2px;border-radius:8px}
.session-focus .set .btn{min-height:46px;min-width:44px;padding:7px;font-size:20px;border-radius:9px}
.session-focus .set .done{background:#20282a;color:#99a8a4;border-color:#475553}
.session-focus .set .checked{background:#21835c;color:#fff;border-color:#53bb85}
.session-focus .set.completed-set input{border-color:#3d7458}
.session-focus .set small{font-size:9px;letter-spacing:0;color:#b1bebb;margin:4px 0}
@media(max-width:380px){.exercise-switch{grid-template-columns:1fr 1.4fr 1fr;gap:4px}.exercise-switch .btn{font-size:11px}}
/* 6.3 — explainable, conservative adaptive recommendations */
.coach-insight{border:1px solid #47655a;background:#172621;border-radius:14px;padding:14px}
.coach-insight strong{letter-spacing:.8px;font-size:11px;color:#b4e4cb}
.coach-insight.coach-adjust{border-color:#987d50;background:#28261d}
.coach-insight.coach-hold{border-color:#a15e5c;background:#312324}
.coach-budgets{margin-top:8px}.coach-budgets .choice{min-width:64px;min-height:43px}
.coach-manual-fields{margin:16px 0 10px;padding:12px;border:1px solid #354540;border-radius:12px}
.coach-manual-fields summary{cursor:pointer;color:#b6c8c1;font-size:13px}
.coach-manual-fields .split{margin-top:12px}
@media(max-width:430px){.coach-insight .row.between{align-items:flex-start;gap:9px;flex-wrap:wrap}}

function authDB(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(Error('Tämä selain ei tue suojattua laiteavaimen tallennusta'));return;}
    const req=indexedDB.open('ultra-performance-auth',1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('keys'))req.result.createObjectStore('keys');};
    req.onerror=()=>reject(req.error||Error('Tietokanta ei ole käytettävissä'));
    req.onsuccess=()=>resolve(req.result);
  });
}
async function readDevice(){
  const db=await authDB();return new Promise((resolve,reject)=>{
    const tx=db.transaction('keys','readonly');const req=tx.objectStore('keys').get('device');
    req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();
  });
}
async function persistDevice(credential){
  const db=await authDB();return new Promise((resolve,reject)=>{
    const tx=db.transaction('keys','readwrite');tx.objectStore('keys').put(credential,'device');
    tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error);
  });
}
async function deleteDevice(){
  const db=await authDB();return new Promise((resolve,reject)=>{
    const tx=db.transaction('keys','readwrite');tx.objectStore('keys').delete('device');
    tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error);
  });
}
const deviceReadyPromise=readDevice().then(value=>{deviceCredential=value}).catch(e=>{console.info('Laitteen paritus ei ole käytettävissä:',e.message)});
function storeRemoteInputs(){
  const address=String(document.querySelector('#worker-url')?.value||'').trim();
  const token=String(document.querySelector('#worker-admin')?.value||'').trim();
  if(address){
    const u=new URL(address);
    if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('Vain tavallinen HTTPS-osoite hyväksytään');
    workerUrl=u.origin;localStorage.setItem('ultra-performance-worker-url',workerUrl);
  }
  if(token){
    if(token.length<32)throw Error('Worker Access Tokenin pitää olla vähintään 32 merkkiä pitkä');
    workerAdmin=token;
    try{sessionStorage.setItem('ultra-performance-worker-session',token)}catch(e){console.info('Istuntotallennus ei käytettävissä')}
  }
}
function configuredRemote(){
  if(!workerUrl)throw Error('Worker-osoite puuttuu. Syötä HTTPS-osoite Settings-näkymässä.');
  const u=new URL(workerUrl);
  if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash)throw Error('Worker-osoitteen pitää olla tavallinen HTTPS-osoite ilman muita kenttiä.');

}
function base64url(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function deviceAuthorization(path,method){
  if(!deviceCredential?.privateKey)throw Error('ADMIN_TOKEN puuttuu eikä tätä laitetta ole paritettu. Avaa Settings ja parita tämä laite kerran.');
  const ts=String(Date.now());
  const payload=new TextEncoder().encode(`${method}\n${path}\n${ts}`);
  const signature=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},deviceCredential.privateKey,payload);
  return `Device ${deviceCredential.id}:${ts}:${base64url(signature)}`;
}
async function remoteFetch(path,method='GET',body=null,adminOnly=false){
  const base=configuredRemote();
  await deviceReadyPromise;
  const call=async(asDevice)=>{
    const auth=asDevice?await deviceAuthorization(path,method):'Bearer '+workerAdmin;
    const resp=await fetch(base+path,{method,headers:{Authorization:auth,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok)throw Object.assign(Error(data?.error||`HTTP ${resp.status}`),{status:resp.status});
    return data;
  };
  if(adminOnly&&!workerAdmin)throw Error('Tämä toiminto vaatii ADMIN_TOKEN-tunnuksen tähän istuntoon.');
  if(workerAdmin){try{return await call(false)}catch(e){if(e.status===401&&deviceCredential&&!adminOnly)return call(true);throw e}}
  return call(true);
}
async function pairDevice(){
  try{
    storeRemoteInputs();await deviceReadyPromise;
    if(!workerAdmin)throw Error('Syötä ensin ADMIN_TOKEN ja paina Tallenna.');
    if(!window.crypto?.subtle)throw Error('Suojattu WebCrypto-yhteys puuttuu');
    if(deviceCredential){syncMessage='Tämä laite on jo paritettu.';render();return}
    const keys=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);
    const publicKey=await crypto.subtle.exportKey('jwk',keys.publicKey);
    const id=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
    await remoteFetch('/device/enroll','POST',{id,publicKey},true);
    await persistDevice({id,privateKey:keys.privateKey});deviceCredential={id,privateKey:keys.privateKey};
    syncMessage='Laite paritettu turvallisesti. Automaattinen synkronointi toimii ilman ADMIN_TOKENia tässä selaimessa.';
    render();void autoSyncIfDue(true);
  }catch(e){syncMessage='Paritusvirhe: '+e.message;render()}
}

function importSnapshot(snapshot){
  if(!snapshot||typeof snapshot!=='object')throw Error('Taustahaun tuloksia ei löytynyt. Varmista, että Worker 6.2 on julkaistu.');
  const err=[];let a=0,r=0,w=0;
  if(Array.isArray(snapshot.garmin)&&snapshot.garmin.length){
    try{a=importGarminJSON(state,snapshot.garmin).added}catch(e){if(!e.message.includes('Uusia aktiviteetteja ei löytynyt'))err.push('Garmin-tuonti: '+e.message)}
  }
  if(Array.isArray(snapshot.ouraRecovery)&&snapshot.ouraRecovery.length){
    try{const before=new Set(state.recovery.map(x=>x.date));importOuraJSON(state,{data:snapshot.ouraRecovery});r=state.recovery.filter(x=>!before.has(x.date)).length}
    catch(e){err.push('Oura palautuminen: '+e.message)}
  }
  if(Array.isArray(snapshot.ouraWorkouts)&&snapshot.ouraWorkouts.length){
    try{w=importOuraWorkoutJSON(state,{data:snapshot.ouraWorkouts}).added}catch(e){err.push('Oura-aktiviteetit: '+e.message)}
  }
  const sourceErrors=Object.entries(snapshot.errors||{}).map(([k,v])=>`${k}: ${v}`);
  return {a,r,w,errors:[...err,...sourceErrors],timestamp:snapshot.updatedAt};
}
async function synchronizeRemote({automatic=false}={}){
  if(syncBusy)return;
  if(!automatic){try{storeRemoteInputs()}catch(e){syncMessage='Synkronointi epäonnistui: '+e.message;render();return}}
  syncBusy=true;
  if(!automatic){syncMessage='Haetaan Garmin- ja Oura-tiedot…';render()}
  try{
    const status=await remoteFetch('/status');remoteStatus=status;
    let snapshot;
    if(automatic){
      const cached=await remoteFetch('/snapshot');snapshot=cached.snapshot;
      if(!snapshot||Date.now()-Date.parse(snapshot.updatedAt)>6*3600e3){snapshot=(await remoteFetch('/sync','POST')).snapshot}
    }else{snapshot=(await remoteFetch('/sync?force=1','POST')).snapshot}
    const result=importSnapshot(snapshot);
    if(result.a||result.r||result.w)commit(false);
    lastSyncAt=result.timestamp||new Date().toISOString();localStorage.setItem('up62-last-sync',lastSyncAt);
    syncMessage=`${automatic?'Automaattinen päivitys':'Synkronointi'}: ${result.a} uutta Garmin-harjoitusta, ${result.r} uutta palautumispäivää, ${result.w} Oura-aktiviteettia. ${result.errors.join(' / ')}`;

}

function svgSpark(points, tone = '#31946e') { if (points.length < 2)

function trendCard(state,key,label,unit,precision=0,tone='#65a7c3'){

        return `<div class="modal-backdrop"><section class="card modal" role="dialog" aria-modal="true" aria-label="Palautumisen check-in"><div class="row between"><h2>Daily recovery check-in</h2><button class="btn sm ghost" data-action="close">Sulje ✕</button></div><p class="soft mt">Oma arvio täydentää mahdollisia laitemittauksia. Tietoja ei lähetetä palvelimelle.</p><form id="recovery-form"><div class="split"><div class="field"><label>Vire · 1–5</label><select name="energy">${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${(rec?.energy || 3) === n ? 'selected' : ''}>${n} / 5</option>`).join('')}</select></div><div class="field"><label>Jalat · 0–3</label><select name="legs">${[0, 1, 2, 3].map(n => `<option value="${n}" ${(rec?.legs || 0) === n ? 'selected' : ''}>${n} / 3</option>`).join('')}</select></div></div><div class="field"><label>Kipu tai sairausoireita tänään?</label><select name="pain"><option value="0" ${!rec?.pain ? 'selected' : ''}>Ei</option><option value="1" ${rec?.pain ? 'selected' : ''}>Kyllä — arvioi kuormitus erikseen</option></select></div><details class="coach-manual-fields"><summary>Muokkaa Oura-mittauksia käsin (valinnainen)</summary><div class="split"><div class="field"><label>Unen kesto · h</label><input name="sleep" type="number" min="0" max="16" step="0.1" value="${rec?.sleepHours ?? ''}" placeholder="7.5"></div><div class="field"><label>Oura HRV · ms (valinnainen)</label><input name="hrv" type="number" min="0" max="350" value="${rec?.hrv ?? ''}" placeholder="—"></div></div><div class="split"><div class="field"><label>Leposyke (valinnainen)</label><input name="restHr" type="number" min="25" max="150" value="${rec?.restHr ?? ''}" placeholder="—"></div><div class="field"><label>Oura Readiness (valinnainen)</label><input name="readiness" type="number" min="0" max="100" value="${rec?.readiness ?? ''}" placeholder="—"></div></div></details><button type="submit" class="btn primary block mt">Tallenna check-in</button></form></section></div>`;
    }
    if (activeModal === 'finish')
        return `<div class="modal-backdrop"><section class="card modal" role="dialog" aria-modal="true" aria-label="Lopeta harjoitus"><div class="row between"><h2>Session complete</h2><button class="btn sm ghost" data-action="close">Jatka treeniä ✕</button></div><p class="soft mt">Kirjaa lyhyt Smart Check-in, jotta Adaptive Coach voi huomioida harjoituksen.</p><form id="finish-form"><div class="split"><div class="field"><label>Session RPE · 1–10</label><select name="rpe">${Array.from({ length: 10 }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === 7 ? 'selected' : ''}>${n}/10</option>`).join('')}</select></div><div class="field"><label>Jalkakuormitus · 0–3</label><select name="legs"><option value="0">Ei</option><option value="1" selected>Kevyt</option><option value="2">Kohtalainen</option><option value="3">Voimakas</option></select></div></div>${state.active?.session.sport !== 'strength' ? `<div class="split"><div class="field"><label>Matka · km</label><input type="number" name="distance" min="0" step="0.1" placeholder="0"></div><div class="field"><label>Nousumetrit</label><input type="number" name="ascent" min="0" step="1" placeholder="0"></div></div><div class="field"><label>Keskisyke</label><input name="avgHr" type="number" min="0" max="220" placeholder="valinnainen"></div>` : ''}<div class="field"><label>Huomio</label><textarea maxlength="500" name="notes" placeholder="Treenin tuntuma, tekniikka, olosuhteet..."></textarea></div><button class="btn primary block" type="submit">Vahvista ja tallenna</button></form></section></div>`;
    if (activeModal === 'activityFeedback') {
        const a = state.activities.find(x => x.id === feedbackActivityId);
        if (!a)
            return '';
        return `<div class="modal-backdrop"><section class="card modal" role="dialog" aria-modal="true"><div class="row between"><h2>Smart Check-in</h2><button class="btn sm ghost" data-action="close">Sulje ✕</button></div><p class="soft mt">${esc(a.title)} · ${fiDate(a.date)}. Laitedatasta ei voi päätellä luotettavasti jalkojen kuormituksen tunnetta.</p><form id="feedback-form"><div class="split"><div class="field"><label>Session RPE</label><select name="rpe">${Array.from({ length: 10 }, (_, i) => i + 1).map(n => `<option value="${n}" ${n === 6 ? 'selected' : ''}>${n}/10</option>`).join('')}</select></div><div class="field"><label>Jalkojen rasitus</label><select name="legs"><option value="0">Ei</option><option value="1">Kevyt</option><option value="2">Kohtalainen</option><option value="3">Voimakas</option></select></div></div><button class="btn primary block" type="submit">Tallenna palaute</button></form></section></div>`;
    }
    const p = state.plan.find(x => x.id === editPlanId);
    if (!p)
        return '';
    return `<div class="modal-backdrop"><section class="card modal" role="dialog" aria-modal="true" aria-label="Muokkaa suunnitelmaa"><div class="row between"><h2>Muokkaa harjoitusta</h2><button class="btn sm ghost" data-action="close">Sulje ✕</button></div><form id="plan-form"><div class="field"><label>Harjoitus</label><select name="kind">${Object.entries(TEMPLATES).map(([k, t]) => `<option value="${k}" ${p.kind === k ? 'selected' : ''}>${esc(t.title)} · ${ACTIVITIES[t.sport]}</option>`).join('')}</select></div><div class="split"><div class="field"><label>Päivä</label><input type="date" name="date" value="${p.date}" required></div><div class="field"><label>Aika · min</label><input type="number" name="duration" min="20" max="240" value="${p.duration}" required></div></div><p class="soft">Harjoittelulajin vaihtaminen vaatii aina erillisen vahvistuksen. Lukitun harjoituksen saa muuttaa vain itse.</p><button class="btn primary block mt" type="submit">Tallenna muutos</button></form></section></div>`;
}
function render() { const body = tab === 'today' ? todayView() : tab === 'plan' ? planView() : tab === 'train' ? trainView() : tab === 'analyze' ? analyzeView() : settingsView(); el().innerHTML = header() + `<main>${body}</main>` + nav() + modalView(); updateTimer(); }
function changeTab(target) { if (!['today', 'plan', 'train', 'analyze', 'settings'].includes(target))
    return; tab = target; activeModal = ''; window.scrollTo({ top: 0, behavior: 'auto' }); render(); }
function notify(msg) { flash(msg); }
function openModal(s) { activeModal = s; render(); }
function start(kind, minutes, planId) { try {
    startSession(state, kind, minutes, planId);
    restUntil=0;
    tab = 'train';
    activeModal = '';
    commit();
    window.scrollTo(0, 0);
}
catch (e) {
    alert(e.message);
} }
function updateTimer() { const d = state.active; if (!d)
    return; const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(d.startedAt)) / 1000)); const e = document.getElementById('elapsed'); if (e)
    e.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`; const rest = document.getElementById('rest'); if (rest) {
    const x = Math.max(0, Math.ceil((restUntil - Date.now()) / 1000));
    rest.textContent = x ? `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}` : '—';
} }
setInterval(updateTimer, 1000);
function confirmRebuild() {
    const start = planWeek, end = addDays(start, 6);
    const done = state.plan.some(p => p.date >= start && p.date <= end && p.status === 'done');
    if (!confirm(done ? 'Viikon ohjelma luodaan uudelleen. Valmiit harjoitukset säilyvät, mutta keskeneräiset poistuvat. Jatketaanko?' : 'Korvataanko tämän viikon keskeneräiset harjoitukset uudella suunnitelmalla?'))
        return;
    const old = state.plan.filter(p => p.date >= start && p.date <= end && p.status === 'done');
    state.plan = state.plan.filter(p => p.date < start || p.date > end);
    makeWeek(state, start);
    for (const o of old) {
        const matched = state.plan.find(p => p.date === o.date && p.kind === o.kind && p.status === 'planned');
        if (matched)
            matched.status = 'done';
        else
            state.plan.push(o);
    }
    logAction('Viikkosuunnitelma muodostettu uudelleen', 'Käyttäjän hyväksymä muutos');
    commit();
}
function formData(form) { return new FormData(form); }
function parseOptional(form, key) { const raw = String(form.get(key) || '').trim(); return raw === '' ? undefined : num(raw); }
function importExternalFile(file, kind) { if (file.size > 12 * 1024 * 1024) {
    alert('Tiedosto liian suuri');
    return;
} file.text().then(contents => { try {
    const obj = JSON.parse(contents);
    const result = kind === 'garmin' ? importGarminJSON(state, obj) : importOuraJSON(state, obj);
    commit();
    notify(kind === 'garmin' ? `Garmin: ${'added' in result ? result.added : 0} aktiviteettia tuotu` : `Oura: ${result.added} mittausta tuotu`);
}
catch (e) {
    alert('Tuonti epäonnistui: ' + e.message);
} }); }
function importFile(file) { if (file.size > 12 * 1024 * 1024) {
    alert('Tiedosto on liian suuri (enintään 12 MB).');
    return;
} file.text().then(text => { try {
    const raw = JSON.parse(text);
    if (raw?.version === 6 && !confirm('Korvataanko tämän sovelluksen nykyiset tiedot varmuuskopiolla?'))
        return;
    const result = importBackup(state, raw);
    state = result.state;
    commit();
    flash(result.message);
}
catch (e) {
    alert('Tuonti epäonnistui: ' + e.message);
} }); }
window.addEventListener('click', (evt) => {
    const b = evt.target.closest('[data-action]');
    if (!b)
        return;
    const action = b.dataset.action || '';
    const id = b.dataset.id || '';
    const value = b.dataset.value || '';
    if (action === 'tab')
        return changeTab(b.dataset.tab || 'today');
    if (action === 'recovery')
        return openModal('recovery');
    if (action === 'activity')
        return openModal('activity');
    if (action === 'close') {
        activeModal = '';
        return render();
    }
    if(action==='coach-budget'){coachBudget=clamp(num(b.dataset.minutes,45),20,90);localStorage.setItem('up63-coach-budget',String(coachBudget));return render();}
    if (action === 'minutes') {
        selectedMinutes = num(b.dataset.minutes, 45);
        return render();
    }
    if (action === 'choose-kind') {
        selectedKind = b.dataset.kind || 'gym-full-a';
        workoutLibraryOpen = true;
        return render();
    }
    if (action === 'library-toggle') {
        workoutLibraryOpen = !workoutLibraryOpen;
        return render();
    }
    if (action === 'exercise-prev' || action === 'exercise-next' || action === 'exercise-jump') {
        const d=state.active;
        if(!d||d.session.sport!=='strength')return;
        const count=d.session.exercises.length;
        const current=Math.max(0,Math.min(count-1,Number(d.focusIndex||0)));
        d.focusIndex=action==='exercise-jump'?clamp(Number(b.dataset.index||0),0,count-1):clamp(current+(action==='exercise-next'?1:-1),0,count-1);
        commit();
        window.scrollTo(0,0);
        return;
    }
    if (action === 'start-selected')
        return start(selectedKind, selectedMinutes);
    if (action === 'start-plan') {
        const p = state.plan.find(x => x.id === id);
        if (p)
            return start(p.kind, b.dataset.coach==='1'?Math.min(p.duration,coachBudget):p.duration, p.id);
    }
    if (action === 'finish-modal')
        return openModal('finish');
    if (action === 'set-done') {
        const d=state.active, s=d?.sets.find(x=>x.id===id);
        if(!s)return;
        const e=d.session.exercises.find(x=>x.id===s.exerciseId);
        if(!s.done){
            if(s.reps<1){alert('Lisää ensin tehdyt toistot.');return}
            if(e?.venue==='gym'&&!e.bodyweight&&Number(s.weight)<=0){
                alert('Lisää ensin todellinen työpaino kilogrammoina.');
                document.querySelector(`[data-set="${id}"][data-field="weight"]`)?.focus();
                return;
            }
        }
        s.done=!s.done;
        if(s.done){
            restUntil=Date.now() + ((e?.rest||90)*1000);
            d.restUntil=restUntil;
            const ix=d.session.exercises.findIndex(x=>x.id===s.exerciseId);
            const group=d.sets.filter(x=>x.exerciseId===s.exerciseId);
            if(group.length&&group.every(x=>x.done)&&ix<d.session.exercises.length-1){
                const next=d.session.exercises.findIndex((x,j)=>j>ix&&d.sets.some(z=>z.exerciseId===x.id&&!z.done));
                if(next>=0)d.focusIndex=next;
            }
        }
        commit();
        return;
    }
    if (action === 'rest-skip') {
        restUntil=0;
        if(state.active){state.active.restUntil=0;commit(false)}
        updateTimer();
        return;
    }
    if (action === 'discard') {
        if (confirm('Hylätäänkö keskeneräinen harjoitus?')) {
            state.active = null;
            restUntil=0;
            commit();
        }
        return;
    }
    if (action === 'prev-week') {
        planWeek = addDays(planWeek, -7);
        return render();
    }
    if (action === 'next-week') {
        planWeek = addDays(planWeek, 7);
        makeWeek(state, planWeek);
        commit();
        return;
    }
    if (action === 'capacity') {
        state.profile.capacity = value;
        commit();
        notify('Kapasiteetti tallennettu. Luo viikko uudelleen ottaa sen käyttöön.');
        return;
    }
    if (action === 'rebuild-plan')
        return confirmRebuild();
    if (action === 'lock-plan') {
        const p = state.plan.find(p => p.id === id);
        if (p) {
            p.locked = !p.locked;
            commit();
        }
        return;
    }
    if (action === 'edit-plan') {
        editPlanId = id;
        return openModal('planEdit');
    }
    if (action === 'skip-plan') {
        const p = state.plan.find(p => p.id === id);
        if (!p)
            return;
        if (confirm(`Ohitetaanko ${p.title}? Harjoitusvelkaa ei synny.`)) {
            p.status = 'skipped';
            logAction(`${p.title} ohitettu`, 'Käyttäjän päätös; ei takaisinmaksua');
            commit();
        }
        return;
    }
    if (action === 'delete-activity') {
        if (!confirm('Poistetaanko tämä harjoitus pysyvästi?'))
            return;
        state.activities = state.activities.filter(a => a.id !== id);
        commit();
        return;
    }
    if (action === 'split') {
        state.profile.split = value;
        commit();
        notify('Jako tallennettu tuleville viikoille');
        return;
    }
    if (action === 'export') {
        download(`ultra-performance-backup-${filenameDate()}.json`, JSON.stringify(state, null, 2));
        notify('Varmuuskopio ladattu');
        return;
    }
    if (action === 'export-csv') {
        download(`ultra-performance-${filenameDate()}.csv`, csvExport(state), 'text/csv;charset=utf-8');
        return;
    }
    if (action === 'import') {
        document.querySelector('#backup-file')?.click();
        return;
    }
    if (action === 'remote-save') {
        try{
            storeRemoteInputs();
            configuredRemote();
            syncMessage='Yhteysasetukset tallennettu. Tunniste on käytettävissä tässä istunnossa. Kokeile Testaa yhteys.';
            render();
        }catch(e){alert('Virheellinen asetus: '+e.message);}
        return;
    }
    if (action === 'remote-test') { void testRemote(); return; }
    if (action === 'remote-pair') { void pairDevice(); return; }
    if (action === 'remote-unpair') { void unpairDevice(); return; }
    if (action === 'remote-sync') { void synchronizeRemote(); return; }
    if (action === 'remote-oura') { void connectOura(); return; }
    if (action === 'remote-disconnect') { void disconnectOura(); return; }
    if (action === 'import-garmin') {
        document.querySelector('#garmin-file')?.click();
        return;
    }
    if (action === 'import-oura') {
        document.querySelector('#oura-file')?.click();
        return;
    }
    if (action === 'feedback-activity') {
        feedbackActivityId = id;
        return openModal('activityFeedback');
    }
    if (action === 'reset') {
        if (!confirm('Aloitetaanko Ultra Performance 6.0 alusta? Kaikki tämän version harjoitustiedot poistetaan tältä laitteelta.'))
            return;
        state = initial();
        makeWeek(state, today());
        commit();
        return;
    }
});
window.addEventListener('change', evt => {
    if(evt.target?.matches?.('[data-auto-sync]')){autoSyncEnabled=!!evt.target.checked;localStorage.setItem('up62-auto-sync',autoSyncEnabled?'on':'off');syncMessage=autoSyncEnabled?'Automaattinen synkronointi otettu käyttöön.':'Automaattinen synkronointi poistettu käytöstä.';render();if(autoSyncEnabled)void autoSyncIfDue(true);return;}
    const target = evt.target;
    if (target.matches('[data-setting]')) {
        const name = target.dataset.setting;
        if (name === 'capacity')
            state.profile.capacity = target.value;
        else if (name === 'autopilot')
            state.profile.autopilot = target.checked;
        else if (name === 'goalWeight' || name === 'kettlebellKg' || name === 'maxMinutes')
            state.profile[name] = num(target.value);
        commit(false);
        notify('Asetus tallennettu');
        return;
    }
    if (target.id === 'exercise-chart') {
        chartExercise = target.value;
        render();
        return;
    }
    if (target.id === 'backup-file') {
        const file = target.files?.[0];
        if (file)
            importFile(file);
        return;
    }
    if (target.id === 'garmin-file' || target.id === 'oura-file') {
        const file = target.files?.[0];
        if (file)
            importExternalFile(file, target.id === 'garmin-file' ? 'garmin' : 'oura');
        return;
    }
    if (target.dataset.set && state.active) {
        const s = state.active.sets.find(x => x.id === target.dataset.set);
        if (s) {
            const field = target.dataset.field;
            const max = field === 'weight' ? 500 : field === 'reps' ? 50 : 6;
            s[field] = clamp(num(target.value), 0, max);
            commit(false);
        }
        return;
    }
});
window.addEventListener('submit', evt => {
    const form = evt.target;
    if (!form?.id)
        return;
    evt.preventDefault();
    const fd = formData(form);
    try {
        if (form.id === 'activity-form') {
            const date = String(fd.get('date') || today()), sport = String(fd.get('sport')), duration = num(fd.get('duration'));
            const rpe = num(fd.get('rpe')), legs = num(fd.get('legs'));
            const title = ACTIVITIES[sport] || 'Muu liikunta';
            addActivity(state, { source: 'manual', date, startedAt: `${date}T12:00:00`, sport, kind: 'unplanned', title, duration, distanceKm: num(fd.get('distance')), ascentM: num(fd.get('ascent')), avgHr: num(fd.get('hr')), sessionRpe: rpe, legStress: legs, notes: String(fd.get('notes') || '').slice(0, 500), sets: [] });
            activeModal = '';
            commit();
            notify('Aktiviteetti tallennettu ja kuormitus huomioitu');
            return;
        }
        if (form.id === 'recovery-form') {
            const previous=state.recovery.find(x=>x.date===today())||{};
            const entry = {...previous, date: today(), energy: clamp(num(fd.get('energy'), 3), 1, 5), legs: clamp(num(fd.get('legs')), 0, 3), pain: String(fd.get('pain')) === '1' };
            for (const [k, name] of [['sleep', 'sleepHours'], ['hrv', 'hrv'], ['restHr', 'restHr'], ['readiness', 'readiness']]) {
                const n = parseOptional(fd, k);
                if (n !== undefined)
                    entry[name] = n;
            }
            recordRecovery(state, entry);
            activeModal = '';
            commit();
            notify('Palautumisen check-in tallennettu');
            return;
        }
        if (form.id === 'finish-form') {
            const a = finishSession(state, { rpe: num(fd.get('rpe'), 7), legs: num(fd.get('legs')), distance: parseOptional(fd, 'distance'), ascent: parseOptional(fd, 'ascent'), avgHr: parseOptional(fd, 'avgHr'), notes: String(fd.get('notes') || '').slice(0, 500) });
            activeModal = '';
            tab = 'today';
            commit();
            notify(`${a.title} tallennettu`);
            return;
        }
        if (form.id === 'feedback-form') {
            const a = state.activities.find(x => x.id === feedbackActivityId);
            if (!a)
                throw Error('Harjoitusta ei löytynyt');
            a.sessionRpe = clamp(num(fd.get('rpe'), 6), 1, 10);
            a.legStress = clamp(num(fd.get('legs')), 0, 3);
            activeModal = '';
            commit();
            notify('Smart Check-in tallennettu');
            return;
        }
        if (form.id === 'plan-form') {
            const p = state.plan.find(p => p.id === editPlanId);
            if (!p)
                throw Error('Harjoitusta ei löytynyt');
            const kind = String(fd.get('kind')), newType = TEMPLATES[kind];
            if (!newType)
                throw Error('Tuntematon harjoitus');
            const changed = p.sport !== newType.sport;
            if (changed && !confirm(`Vahvistatko harjoittelulajin vaihdon (${ACTIVITIES[p.sport]} → ${ACTIVITIES[newType.sport]})?`))
                return;
            swapPlan(state, p.id, kind, changed);
            p.date = String(fd.get('date'));
            p.duration = clamp(num(fd.get('duration'), 45), 20, 240);
            p.locked = false;
            activeModal = '';
            commit();
            notify('Suunnitelma päivitetty');
            return;
        }
    }
    catch (e) {
        alert(e.message);
    }
});
if('serviceWorker' in navigator&&location.protocol==='https:'){
    window.addEventListener('load',async()=>{
      try{
        const reg=await navigator.serviceWorker.register('./sw.js');
        if(reg.waiting)syncMessage='Sovelluspäivitys saatavilla: päivitä sivu, kun et ole kesken harjoituksen.';
        reg.addEventListener('updatefound',()=>{
          const worker=reg.installing;
          worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller){syncMessage='Uusi sovellusversio saatavilla. Päivitä sivu, kun harjoitus on valmis.';if(tab==='settings')render()}});
        });
        setInterval(()=>{if(document.visibilityState==='visible')void reg.update().catch(()=>{})},60*60e3);
      }catch(e){console.info('Offline-välimuisti ei käynnistynyt',e)}
    });
}
window.addEventListener('pageshow',()=>{setTimeout(()=>void autoSyncIfDue(),1500)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')void autoSyncIfDue()});
window.addEventListener('online',()=>{void autoSyncIfDue(true)});
setInterval(()=>void autoSyncIfDue(),30*60e3);
render();
void deviceReadyPromise.then(()=>{if(tab==='settings')render();void autoSyncIfDue(true)});
if(new URLSearchParams(location.search).has('oura')){
  const status=new URLSearchParams(location.search).get('oura');
  tab='settings';syncMessage=status==='connected'?'Oura valtuutettu! Anna Worker Access Token ja testaa yhteys.':'Oura-yhteyttä ei hyväksytty.';
  history.replaceState(null,'',location.pathname);render();
}
