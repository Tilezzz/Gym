    const PHASES=[PROGRAM,PHASE2,PHASE3];

    const DEFAULT=()=>({version:4,program:structuredCopy(PROGRAM),history:[],active:null,settings:{weekly:3,goalWeight:80,bodyweights:[],split:'ul',duration:60,loadMode:'normal',selected:{ul:'upper',full:'fullA',ppl:'push'}},cycle:null});
    function structuredCopy(o){return JSON.parse(JSON.stringify(o))}
    function normalizeSettings(v){
      if(!v.settings||typeof v.settings!=='object')v.settings={};
      const d=v.settings;
      d.weekly=[0,1,2,3,4,5].includes(Number(d.weekly))?Number(d.weekly):3;

      if(!d.selected||typeof d.selected!=='object'){
        const past=[...(Array.isArray(v.history)?v.history:[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
        d.selected={ul:past[0]?.kind==='upper'?'lower':'upper'};
      }
      const valid={ul:['upper','lower'],full:['fullA','fullB'],ppl:['push','pull','legs']};
      for(const k of Object.keys(valid))if(!valid[k].includes(d.selected[k]))d.selected[k]=valid[k][0];
      return v;
    }
    function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.program&&Array.isArray(v.history)&&v.settings&&Array.isArray(v.program.upper)&&Array.isArray(v.program.lower)){v.version=4;return normalizeSettings(v)}}catch(e){}return DEFAULT()}
    let data=load(),tab='today',detailsOpened=null,statExercise='u-bench',toastTimer=null,cyclePreview=false;
    const $=sel=>document.querySelector(sel);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const isoLocalDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const n=v=>Number.isFinite(Number(v))?Number(v):0;

    // Päivämäärä laskentaan UTC-päivinä; kesä- ja talviaika eivät siirrä ohjelmaa.
    function dayStamp(iso){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');return m?Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5):NaN}
    function initCycle(){
      const c=data.cycle;
      if(!c||!Array.isArray(c.variants)||c.variants.length!==3||!Number.isFinite(dayStamp(c.startDate))){
        data.cycle={startDate:isoLocalDate(),weeksPerBlock:8,startPhase:0,currentBlock:0,variants:[structuredCopy(data.program),structuredCopy(PHASE2),structuredCopy(PHASE3)]};
      }else{
        c.weeksPerBlock=[6,8,10,12].includes(+c.weeksPerBlock)?+c.weeksPerBlock:8;
        c.startPhase=Math.max(0,Math.floor(Number(c.startPhase)||0))%3;
        c.currentBlock=Math.max(0,Math.floor(Number(c.currentBlock)||0));
        for(let i=0;i<3;i++)if(!c.variants[i]||!Array.isArray(c.variants[i].upper)||!Array.isArray(c.variants[i].lower))c.variants[i]=structuredCopy(PHASES[i]);
      }
    }
    function phaseAt(block){return (data.cycle.startPhase+block)%3}
    function cycleInfo(){
      const c=data.cycle,days=Math.max(0,dayStamp(isoLocalDate())-dayStamp(c.startDate));
      const span=c.weeksPerBlock*7,block=Math.floor(days/span),phase=phaseAt(block);
      const dayInBlock=days%span,week=Math.floor(dayInBlock/7)+1;
      const nextDate=new Date((dayStamp(c.startDate)+(block+1)*span)*864e5).toISOString().slice(0,10);
      return {block,phase,week,nextDate,daysLeft:span-dayInBlock};
    }
    function save(){try{

    function ensureCycle(){

        data.cycle.currentBlock=info.block;
        data.program=structuredCopy(data.cycle.variants[info.phase]);

    const LABELS={upper:'A · Ylävartalo',lower:'B · Alavartalo',fullA:'Koko kroppa A',fullB:'Koko kroppa B',push:'Push · Työntävät',pull:'Pull · Vetävät',legs:'Legs · Jalat'};
    const SPLITS={ul:{name:'2-jakoinen · Ylä / ala',keys:['upper','lower']},full:{name:'1-jakoinen · Koko kroppa',keys:['fullA','fullB']},ppl:{name:'3-jakoinen · Push / Pull / Legs',keys:['push','pull','legs']}};

    function rirTarget(ex,mode=data.settings.loadMode){
      const prog=(cycleInfo().week-1)/Math.max(1,data.cycle.weeksPerBlock-1);
      const base=prog<.25?3:prog<.65?2:1;
      const target=(mode==='normal'?base:mode==='fatigue'?Math.max(3,base+1):(ex.group==='Etureidet'||ex.group==='Takareidet'||ex.group==='Pohkeet')?Math.max(3,base+1):base);
      return `${target}–${Math.min(4,target+1)}`;
    }
    function isLeg(ex){return ['Etureidet','Takareidet','Pohkeet'].includes(ex.group)}
    function volumeReport(){
      const groups=['Rinta','Selkä','Olkapäät','Etureidet','Takareidet','Pohkeet','Hauis','Ojentaja','Keskivartalo'];
      const since=Date.now()-7*864e5;
      const map=Object.fromEntries(groups.map(x=>[x,0]));
      for(const h of data.history)if(new Date(h.date).getTime()>=since)for(const set of h.sets||[])if(map[set.group]!=null)map[set.group]++;
      return map;

    function volumeCard(){const v=volumeReport();return `<section class="card"><div class="card-head"><div><div class="section-kicker">Volyymi · liukuvat 7 vrk</div><h2>Suorat työsarjat</h2><p class="card-sub">Lihasryhmittäinen seuranta toteutuneista sarjoista.</p></div><span class="badge">RECOVERY AWARE</span></div><div class="data-table">${Object.entries(v).map(([k,val])=>`<div class="data-row"><span>${k}</span><div class="data-track"><i class="data-fill" style="width:${Math.min(val/16*100,100)}%"></i></div><span class="data-num">${val}</span></div>`).join('')}</div><p class="small-note spaced">Palkin asteikko 0–16 sarjaa. Kyykkyä ei lasketa erilliseksi takareisisarjaksi eikä penkkiä ojentajasarjaksi. Viitteellinen lähtötaso usein 8–12+ suoraa tai merkittävästi kuormittavaa sarjaa / lihasryhmä / viikko, mutta sopiva määrä riippuu juoksusta, kokonaiskuormasta ja palautumisesta. Tämä ei ole tavoite jokaiselle viikolle.</p></section>`}

    function getTemplates(key){
      const u=data.program.upper,l=data.program.lower;
      const ux=(id,g,i=0)=>findEx('upper',id,g,i),lx=(id,g,i=0)=>findEx('lower',id,g,i);
      const press=extra('x-shoulder-press','Pystypunnerrus käsipainoilla','Olkapäät',3,8,12,120,2,'Paina hallitusti ja pidä kylkiluut alhaalla.');
      const fly=extra('x-cable-fly','Ristikkäistalja rinnalle','Rinta',2,12,15,75,1.25);
      const oneRow=extra('x-one-arm-row','Yhden käden soutu taljassa','Selkä',3,10,12,90,2.5);
      const hammer=extra('x-hammer-curl','Vasarakääntö käsipainoilla','Hauis',2,10,15,75,1.25);
      const trOver=extra('x-overhead-triceps','Ojentaja pään yli taljassa','Ojentaja',2,10,15,75,1.25);
      const base={
        upper:u,lower:l,
        fullA:[lx('l-squat','Etureidet'),ux('u-bench','Rinta'),ux('u-row','Selkä'),lx('l-curl','Takareidet'),ux('u-lateral','Olkapäät'),lx('l-calves','Pohkeet'),ux('u-tricep','Ojentaja'),lx('l-abs','Keskivartalo')],
        fullB:[lx('l-rdl','Takareidet'),ux('u-pull','Selkä'),ux('u-incline','Rinta',1),lx('l-press','Etureidet',1),ux('u-rear','Olkapäät',1),ux('u-curl','Hauis'),lx('l-calves','Pohkeet'),lx('l-abs','Keskivartalo')],
        push:[ux('u-bench','Rinta'),ux('u-incline','Rinta',1),press,ux('u-lateral','Olkapäät'),fly,ux('u-tricep','Ojentaja'),trOver],
        pull:[ux('u-row','Selkä'),ux('u-pull','Selkä',1),oneRow,ux('u-rear','Olkapäät',1),ux('u-curl','Hauis'),hammer],
        legs:l
      };
      // Do not repeat a source exercise if the user has customized the base program.
      return (base[key]||u).filter((ex,i,arr)=>ex&&arr.findIndex(e=>e.id===ex.id)===i);
    }
    function sessionEstimate(es,minutes=60){
      // Movement preparation + work time + inter-set rests + transitions; indicative, not a guarantee.
      const warmup=minutes<=30?6:minutes<=45?8:10;
      const work=es.reduce((sum,e)=>sum+e.sets*0.8+(e.sets-1)*e.rest/60+1.0,0);
      return Math.ceil(warmup+work);
    }
    function buildSession(key,minutes){
      let all=getTemplates(key).filter(Boolean).map(ex=>structuredCopy(ex));
      // An experienced lifter retains key patterns; short sessions scale volume, not execution quality.
      if(key==='upper'&&minutes<=60&&all.length>=8)all=[...all.slice(0,5),...all.slice(6,8),all[5],...all.slice(8)];
      const mode=data.settings.loadMode||'normal';
      const budget=minutes===30?30:minutes===45?45:minutes===60?60:75;
      const targetSets=minutes===30?2:minutes===45?3:minutes===60?3:3;
      const out=[];
      const limit=minutes===30?4:minutes===45?5:minutes===60?7:8;
      for(let i=0;i<Math.min(all.length,limit);i++){
        const ex=all[i];
        ex.sets=Math.min(4,Math.max(2,Math.min(Number(ex.sets)||3,targetSets)));
        if(minutes===30 && i>=2)ex.sets=2;
        if(minutes===45 && i>=3)ex.sets=2;
        if(mode==='fatigue'||(mode==='run'&&isLeg(ex)))ex.sets=Math.max(1,ex.sets-1);
        // If no time is left, omit accessories before reducing rest below useful values.
        if(i>=2 && sessionEstimate([...out,ex],minutes)>budget)break;
        out.push(ex);
      }
      return out;
    }
    function sessionSets(es){return es.reduce((sum,e)=>sum+e.sets,0)}

    function recommend(ex){
      const lastSession=recent().find(h=>(h.sets||[]).some(s=>s.exerciseId===ex.id));
      const arr=(lastSession?.sets||[]).filter(s=>s.exerciseId===ex.id&&n(s.reps)>0&&n(s.weight)>=0);
      if(!arr.length)return {weight:'',tip:`Aloituskuorma: löydä ${ex.min}–${ex.max} toiston työpaino RIR ${rirTarget(ex)} -tasolle. Lämmittelysarjoja ei kirjata työvolyymiin.`,status:'START'};
      const weight=arr[0].weight;
      const same=arr.filter(s=>n(s.weight)===n(weight));
      const allTop=same.length>=2&&same.length===arr.length&&same.every(s=>n(s.reps)>=ex.max&&n(s.rir)>=1);
      const tooHeavy=arr.some(s=>n(s.reps)<ex.min&&n(s.rir)===0);
      const proposed=+(n(weight)+(allTop?n(ex.increment):0)).toFixed(2);
      if(allTop)return {weight:String(proposed),tip:`Double progression: ${arr.length} sarjaa ylätoistorajalla. Nosta kuormaa ${ex.increment} kg → ${proposed} kg, tavoite RIR ${rirTarget(ex)}.`,status:'INCREASE'};
      if(tooHeavy)return {weight:String(weight),tip:`Työpaino ${weight} kg. Alaraja jäi vajaaksi RIR 0:lla – vähennä kuormaa tarvittaessa 2–5 % ja palauta puhdas liikerata.`,status:'ADJUST'};
      return {weight:String(weight),tip:`Edellinen ${arr.map(x=>x.reps).join(' / ')} × ${weight} kg. Pidä kuorma, kerrytä toistoja kohti ${ex.max}:ttä. RIR ${rirTarget(ex)}.`,status:'HOLD'};

    function statsView(){const all=[...data.program.upper,...data.program.lower,...data.history.flatMap(h=>h.sets||[]).map(s=>({id:s.exerciseId,name:s.name}))].filter((x,i,a)=>a.findIndex(z=>z.id===x.id)===i);if(!all.find(e=>e.id===statExercise))statExercise=all[0]?.id||'';const rr=[...data.history].sort((a,b)=>new Date(a.date)-new Date(b.date));const points=rr.map(h=>{const sets=h.sets.filter(s=>s.exerciseId===statExercise&&n(s.weight)>0&&n(s.reps)>0);return sets.length?{date:h.date,y:Math.max(...sets.map(s=>n(s.weight)*(1+n(s.reps)/30)))}:null}).filter(Boolean).slice(-12);const body=data.settings.bodyweights||[];const bwpts=[...body].sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-12).map(p=>({date:p.date,y:n(p.kg)}));return `<div class="section-heading"><h1>Kehitys</h1><small>Tavoitteet & trendit</small></div>${kpis()}${volumeCard()}<section class="card spaced"><h2>Voimatasojen kehitys</h2><p class="card-sub">Arvioitu 1RM – vain suuntaa antava, ei maksimiykköstesti.</p><div class="field"><label for="stat-ex">Valitse liike</label><select id="stat-ex" data-action="stat-ex">${all.map(ex=>`<option value="${esc(ex.id)}" ${ex.id===statExercise?'selected':''}>${esc(ex.name)}</option>`).join('')}</select></div>${plot(points)}${points.length?`<div class="cards spaced"><div class="kpi"><span>Ensimmäinen arvio</span><strong>${points[0].y.toFixed(1)}</strong><span>kg</span></div><div class="kpi"><span>Viimeisin arvio</span><strong>${points[points.length-1].y.toFixed(1)}</strong><span>kg</span></div><div class="kpi"><span>Muutos</span><strong>${points[points.length-1].y-points[0].y>=0?'+':''}${(points[points.length-1].y-points[0].y).toFixed(1)}</strong><span>kg</span></div></div>`:''}</section><section class="card"><h2>Painon kehitys</h2><p class="card-sub">Kehonpainotavoite ${n(data.settings.goalWeight)||80} kg</p>${plot(bwpts)}<div class="field-grid spaced"><div class="field"><label for="body-kg">Tämänhetkinen paino, kg</label><input id="body-kg" type="number" step="0.1" inputmode="decimal" min="20" max="400" placeholder="76.0"></div><div class="field"><label for="body-date">Päivämäärä</label><input id="body-date" type="date" value="${isoLocalDate()}"></div></div><button class="btn primary" data-action="save-weight">Tallenna paino</button></section><p class="helper">Arvioitu 1RM = paino × (1 + toistot / 30). Sarjapaino ja toistot täytyy suhteuttaa toisiinsa, eikä arvio korvaa todellista voimatestiä. *Volyymi-indeksi laskee kirjattu kg × toistot, eikä esimerkiksi kahden käsipainon yhteispainoa tai todellista lihaskasvua.</p>`}
    function editor(k){return `<section class="card"><div class="card-head"><div><h3>${label(k)}</h3><p class="card-sub">Muokkaa liikkeitä ja sarjoja. Muutokset koskevat uusia treenejä.</p></div><span class="badge">${data.program[k].length} liikettä</span></div>${data.program[k].map((ex,i)=>`<details class="editor-item"><summary>${i+1}. ${esc(ex.name)} · ${ex.sets} × ${ex.min}–${ex.max}</summary><div class="editor-fields"><div class="field"><label>Liikkeen nimi</label><input type="text" maxlength="90" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="name" value="${esc(ex.name)}"></div><div class="field-grid three"><div class="field"><label>Sarjat</label><input type="number" min="1" max="8" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="sets" value="${ex.sets}"></div><div class="field"><label>Toistot min</label><input type="number" min="1" max="40" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="min" value="${ex.min}"></div><div class="field"><label>Toistot max</label><input type="number" min="1" max="40" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="max" value="${ex.max}"></div><div class="field"><label>Lepo (sek)</label><input type="number" min="30" max="600" step="15" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="rest" value="${ex.rest}"></div><div class="field"><label>Lisäys (kg)</label><input type="number" min="0.25" max="20" step="0.25" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="increment" value="${ex.increment}"></div><div class="field"><label>Lihasryhmä</label><input type="text" maxlength="40" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="group" value="${esc(ex.group)}"></div></div><div class="field"><label>Suoritusstandardi / huomio</label><input type="text" maxlength="220" data-action="edit" data-kind="${k}" data-id="${esc(ex.id)}" data-field="note" value="${esc(ex.note)}"></div><div class="button-row"><button class="btn sm secondary" data-action="move" data-kind="${k}" data-id="${esc(ex.id)}" data-dir="-1" ${i===0?'disabled':''}>↑ Ylös</button><button class="btn sm secondary" data-action="move" data-kind="${k}" data-id="${esc(ex.id)}" data-dir="1" ${i===data.program[k].length-1?'disabled':''}>↓ Alas</button><button class="btn sm danger" data-action="delete-ex" data-kind="${k}" data-id="${esc(ex.id)}">Poista</button></div></div></details>`).join('')}<button class="btn secondary block spaced" data-action="add-ex" data-kind="${k}">+ Lisää liike</button></section>`}
    function settingsView(){return `<div class="section-heading"><h1>Asetukset</h1><small>Oma ohjelmasi</small></div><section class="card"><h2>Harjoittelun rytmi</h2><p class="card-sub">Päivän jako ja aika valitaan Treeni-näkymästä. Tässä voit asettaa tavallisen viikkorytmisi.</p><div class="field"><label for="frequency">Tavoiteltu salikertojen määrä / viikko</label><select id="frequency" data-action="frequency">${[0,1,2,3,4,5].map(w=>`<option value="${w}" ${data.settings.weekly===w?'selected':''}>${w===0?'Joustava – ei viikkotavoitetta':w+' kertaa viikossa'}</option>`).join('')}</select></div><div class="field"><label for="goal">Kehonpainotavoite (kg)</label><input id="goal" type="number" min="20" max="400" step="0.5" data-action="goal" value="${esc(data.settings.goalWeight)}"></div><p class="helper">Progressio: käytä RIR-ohjattua double progression -mallia. Nosta kuormaa vasta, kun kaikki samalla painolla tehdyt sarjat saavuttavat toistoalueen ylärajan laadukkaasti. Normaalissa jaksossa tavoite-RIR kiristyy 3→2→1; kuormitusasetukset voivat kasvattaa varaa.</p></section><section class="card"><h2>Mesosyklin pituus ja ohjelmavaihto</h2><p class="card-sub">Perusohjelman liikevariaatiot vaihtuvat määräajoin ja heijastuvat myös koko kropan sekä Push/Pull/Legs-treeneihin. Osaa pääliikkeistä pidetään samoina kehityksen seuraamiseksi.</p><div class="field"><label for="cycle-weeks">Vaihda ohjelma</label><select id="cycle-weeks" data-action="cycle-weeks">${[6,8,10,12].map(w=>`<option value="${w}" ${data.cycle.weeksPerBlock===w?'selected':''}>${w} viikon välein${w===8?' (suositus)':''}</option>`).join('')}</select></div><p class="helper">Nyt: jakso ${cycleInfo().phase+1}/3, viikko ${cycleInfo().week}/${data.cycle.weeksPerBlock}. Seuraava automaattinen vaihto <strong>${fmtDate(cycleInfo().nextDate)}</strong>. Vaihto tapahtuu avatessasi sovelluksen, ei taustalla. Jos muutat vaihtoväliä, nykyisen jakson laskenta alkaa tästä päivästä.</p><div class="button-row spaced"><button class="btn secondary" data-action="next-cycle" ${data.active?'disabled':''}>Siirry seuraavaan jaksoon nyt</button></div><p class="helper spaced">Liikemuokkaukset tallennetaan kyseisen jakson ohjelmaan. Kolmen jakson jälkeen kierto alkaa uudelleen.</p></section><div class="section-heading"><h2>Harjoitusohjelman rakenteen muokkaus</h2><small>Pohja eri treenijaoille</small></div><p class="helper">Nämä ylä- ja alavartalon liikkeet ovat kaikkien treenijakojen perusta. Koko kroppa ja Push/Pull/Legs poimivat niiden liikkeistä tasapainoiset yhdistelmät; kolmijaossa on lisäksi muutama täydentävä vakioliike.</p>${editor('upper')}${editor('lower')}<section class="card"><h2>Varmuuskopiointi</h2><p class="card-sub">Tiedot tallentuvat vain tämän selaimen / asennetun sovelluksen paikalliseen tallennustilaan. Eivät synkronoidu laitteiden välillä.</p><div class="button-row"><button class="btn primary" data-action="export">Vie kaikki (JSON)</button><button class="btn secondary" data-action="csv">Vie sarjat (CSV)</button><button class="btn secondary" data-action="import">Tuo varmuuskopio</button><input id="import-file" class="hidden" type="file" accept=".json,application/json"></div><div class="divider"></div><div class="button-row"><button class="btn secondary" data-action="reset-program">Palauta jakson oletusliikkeet</button><button class="btn danger" data-action="wipe">Poista kaikki tiedot</button></div></section><p class="helper">Yksityisyys: sovellus ei lähetä treenitietoja palvelimelle. Varmuuskopiointi kannattaa tehdä säännöllisesti, sillä selaimen tietojen poistaminen voi hävittää historian.</p>`}
    function notify(msg){document.querySelector('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.textContent=msg;document.body.appendChild(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3000)}
    function render(){ensureCycle();let content=tab==='today'?(data.active?working():dashboard()):tab==='history'?historyView():tab==='stats'?statsView():settingsView();$('#app').innerHTML=`<main class="shell">${top()}${content}</main>${nav()}`;updateClocks()}
    document.addEventListener('input',e=>{const el=e.target,act=el.dataset.action;if(act==='set-input'&&data.active){const s=data.active.entries[el.dataset.id]?.[Number(el.dataset.index)];if(s){s[el.dataset.field]=el.value;save()}}if(act==='notes'&&data.active){data.active.notes=el.value;save()}});
    document.addEventListener('change',e=>{const el=e.target,act=el.dataset.action;if(act==='frequency'){data.settings.weekly=Number(el.value);save();render()}else if(act==='split'){
      const split=el.value;if(!SPLITS[split])return;data.settings.split=split;
      data.settings.selected[split]=nextFor(split);save();render();notify('Treenijako vaihdettu');
    }else if(act==='session-kind'){
      const split=data.settings.split;if(!SPLITS[split].keys.includes(el.value))return;
      data.settings.selected[split]=el.value;save();render();
    }else if(act==='cycle-weeks'){
      const nextWeeks=Number(el.value);if(![6,8,10,12].includes(nextWeeks))return;
      if(data.active){notify('Päätä käynnissä oleva treeni ennen jakson muuttamista');render();return}
      save();const phase=phaseAt(data.cycle.currentBlock);data.cycle.startDate=isoLocalDate();data.cycle.startPhase=phase;data.cycle.currentBlock=0;data.cycle.weeksPerBlock=nextWeeks;save();render();notify('Jakson pituus vaihdettu, laskenta alkaa tänään');
    }else if(act==='goal'){data.settings.goalWeight=n(el.value);save();notify('Tavoite päivitetty')}else if(act==='stat-ex'){statExercise=el.value;render()}else if(act==='edit'){const ex=data.program[el.dataset.kind]?.find(x=>x.id===el.dataset.id);if(!ex)return;let v=el.value;const field=el.dataset.field;if(['sets','min','max','rest','increment'].includes(field)){v=n(v);const ranges={sets:[1,8],min:[1,40],max:[1,40],rest:[30,600],increment:[.25,20]},[lo,hi]=ranges[field];v=Math.max(lo,Math.min(hi,v))}else v=v.trim();if(!v&&typeof v==='string'){notify('Kenttä ei voi olla tyhjä');render();return}ex[field]=v;if(ex.min>ex.max)ex.max=ex.min;save();notify('Muutos tallennettu');/* Don't rerender: preserve open editor */}else if(el.id==='import-file'){const file=el.files?.[0];if(file)importFile(file)}});
    document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||!el.matches('button'))return;const action=el.dataset.action;if(action==='tab'){tab=el.dataset.tab;render();scrollTo(0,0)}else if(action==='duration'){
      const mins=Number(el.dataset.minutes);if(![30,45,60,75].includes(mins))return;
      data.settings.duration=mins;save();render();
    }else if(action==='load-mode'){
      const mode=el.dataset.mode;if(!LOAD_MODES[mode])return;data.settings.loadMode=mode;save();render();
    }else if(action==='preview-cycle'){cyclePreview=!cyclePreview;render()}
    else if(action==='next-cycle'){
      if(data.active){notify('Päätä käynnissä oleva treeni ensin');return}
      if(!confirm('Siirrytäänkö seuraavaan ohjelmajaksoon? Nykyisen jakson muokkaukset ja treenihistoria säilyvät.'))return;
      save();const phase=(phaseAt(data.cycle.currentBlock)+1)%3;
      data.cycle.startDate=isoLocalDate();data.cycle.startPhase=phase;data.cycle.currentBlock=0;
      data.program=structuredCopy(data.cycle.variants[phase]);cyclePreview=false;save();render();notify('Uusi A/B-ohjelma on käytössä');
    }else if(action==='start')start(el.dataset.kind);else if(action==='toggle-set')toggleSet(el.dataset.id,Number(el.dataset.index));else if(action==='finish')finish();else if(action==='discard'){if(confirm('Hylätäänkö keskeneräinen treeni?')){data.active=null;restEnd=0;save();render()}}else if(action==='rest-plus'){restEnd=restEnd?restEnd+30000:Date.now()+30000;updateClocks()}else if(action==='rest-skip'){restEnd=0;updateClocks()}else if(action==='details'){detailsOpened=detailsOpened===el.dataset.id?null:el.dataset.id;render()}else if(action==='delete-history'){if(confirm('Poistetaanko tämä harjoitus historiasta?')){data.history=data.history.filter(h=>h.id!==el.dataset.id);save();render()}}else if(action==='save-weight'){const kg=n($('#body-kg')?.value),date=$('#body-date')?.value;if(kg<20||kg>400||!date){notify('Tarkista paino ja päivämäärä');return}data.settings.bodyweights.push({date:new Date(`${date}T12:00:00`).toISOString(),kg});save();render();notify('Paino tallennettu')}else if(action==='export')download('ultra-gym-varmuuskopio.json','application/json',JSON.stringify(data,null,2));else if(action==='csv')exportCSV();else if(action==='import')$('#import-file').click();else if(action==='reset-program'){if(confirm('Palautetaanko alkuperäiset A- ja B-liikkeet? Historia säilyy.')){data.program=structuredCopy(PHASES[phaseAt(data.cycle.currentBlock)]);data.active=null;save();render()}}else if(action==='wipe'){if(confirm('Poistetaanko KAIKKI harjoitustiedot, painot ja asetukset pysyvästi? Vie varmuuskopio ensin.')){data=DEFAULT();initCycle();save();render()}}else if(action==='add-ex'){const kind=el.dataset.kind;const name=prompt('Uuden liikkeen nimi');if(!name?.trim())return;data.program[kind].push({id:`custom-${Date.now()}-${Math.floor(Math.random()*1e4)}`,name:name.trim().slice(0,90),sets:3,min:8,max:12,rest:90,group:'Muu',increment:2.5,note:'Hallittu liikerata.'});save();render()}else if(action==='delete-ex'){const kind=el.dataset.kind;if(data.program[kind].length<=1){notify('Treenissä pitää olla vähintään yksi liike');return}if(confirm('Poistetaanko tämä liike ohjelmasta? Aiemmat treenitulokset säilyvät.')){data.program[kind]=data.program[kind].filter(ex=>ex.id!==el.dataset.id);save();render()}}else if(action==='move'){const arr=data.program[el.dataset.kind];const ix=arr.findIndex(x=>x.id===el.dataset.id),to=ix+Number(el.dataset.dir);if(ix<0||to<0||to>=arr.length)return;[arr[ix],arr[to]]=[arr[to],arr[ix]];save();render()}});
    function download(filename,type,content){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Tiedosto valmis')}
    function exportCSV(){const rows=[['päivä','jako','liike','lihasryhmä','paino_kg','toistot','RIR','kesto_min']];for(const h of recent())for(const s of h.sets)rows.push([h.date,h.kind,s.name,s.group||'',s.weight,s.reps,s.rir,h.duration]);const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');download('ultra-gym-sarjat.csv','text/csv;charset=utf-8',csv)}
    async function importFile(file){try{const raw=JSON.parse(await file.text());if(!raw||!raw.program||!Array.isArray(raw.program.upper)||!Array.isArray(raw.program.lower)||!Array.isArray(raw.history)||!raw.settings||!Array.isArray(raw.settings.bodyweights))throw Error('Virheellinen tiedosto');if(raw.history.length>50000||raw.program.upper.length>100||raw.program.lower.length>100)throw Error('Tiedostossa liikaa tietoja');if(!confirm('Korvataanko nykyiset tiedot varmuuskopion sisällöllä?'))return;data=normalizeSettings(raw);data.active=null;data.version=4;initCycle();ensureCycle();save();tab='today';render();notify('Varmuuskopio tuotu')}catch(e){alert('Varmuuskopion tuonti epäonnistui: '+e.message)}}
    setInterval(updateClocks,1000);
    if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
    render();
  })();
  </script>
